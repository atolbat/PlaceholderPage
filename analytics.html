<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seller Analytics · Ozon — исследовательская панель</title>
<meta name="description" content="Квазинаучная аналитическая панель продавца Ozon: прогнозные модели, распределения, юнит-экономика, нишевые метрики. Данные демо 1:1 со структурами Ozon Seller API.">
<style>
:root{
  --bg:#F5F6F3; --card:#FFFFFF; --ink:#14161A; --mut:#5F646D; --faint:#8B909A;
  --line:#E2E4DF; --line2:#EDEEEA; --accent:#1450A3; --accent-soft:#E8EFFA;
  --up:#0B7A3E; --up-soft:#E7F3EC; --down:#B3261E; --down-soft:#FAECEB;
  --warn:#8F5B00; --warn-soft:#F8F0DE; --vio:#5B3FA8; --vio-soft:#EEE9F8;
  --mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:10px; --r-sm:7px; --shadow:0 1px 2px rgba(20,22,26,.05),0 1px 6px rgba(20,22,26,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 13px/1.45 var(--sans);font-feature-settings:'tnum' 1;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#C9CCC5;border-radius:3px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;height:46px;padding:0 10px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.logo{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;font:700 11px/1 var(--mono);letter-spacing:-.03em;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.bt b{font-size:12.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.bt i{font-style:normal;font-size:9.5px;color:var(--faint);white-space:nowrap}
.tspacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:99px;font:500 10.5px/1 var(--sans);color:var(--mut);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.chip.live .dot{background:var(--up)}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:550 11.5px/1 var(--sans);color:var(--ink)}
.tbtn:active{background:var(--line2)}
.tbtn svg{width:13px;height:13px;flex:none}
@media(max-width:479px){.tbtn span{display:none}.tbtn{padding:0 8px}.bt i{display:none}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:46px;z-index:55;display:flex;gap:2px;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:28px;padding:0 11px;border-radius:8px;font:550 11.5px/1 var(--sans);color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .cnt{font-family:var(--mono);font-size:9.5px;opacity:.65;margin-left:3px}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:10px 8px 28px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.g1{grid-column:span 2}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}.g1{grid-column:span 3}.g2{grid-column:span 2}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 12px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.card-h h3{font:650 12.5px/1.2 var(--sans);letter-spacing:-.01em}
.card-h .sub{font-size:10px;color:var(--faint)}
.card-h .sp{flex:1}
.seclab{display:flex;align-items:center;gap:8px;margin:14px 2px 7px;font:650 10px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.seclab::after{content:'';flex:1;height:1px;background:var(--line)}
.seclab b{color:var(--mut);font-weight:650;letter-spacing:0;text-transform:none}

/* ---------- KPI strip ---------- */
.kpis{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 148px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px 7px;text-align:left;position:relative;overflow:hidden}
.kpi:active{border-color:#C7CAC3}
.kpi .l{font:600 9.5px/1.15 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:flex;gap:4px;align-items:center}
.kpi .v{font:600 16.5px/1.15 var(--mono);letter-spacing:-.02em;margin-top:4px}
.kpi .v small{font-size:10.5px;font-weight:500;color:var(--mut)}
.kpi .d{display:flex;align-items:center;gap:5px;margin-top:3px;font:550 10.5px/1 var(--mono)}
.kpi .d .up{color:var(--up)}.kpi .d .dn{color:var(--down)}.kpi .d .fl{color:var(--faint)}
.kpi .spark{position:absolute;right:6px;bottom:20px;opacity:.85}
.kpi .info{position:absolute;top:7px;right:7px;color:#C4C8CE}

/* ---------- badges & chips ---------- */
.bdg{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;font:650 9.5px/1 var(--sans);letter-spacing:.02em}
.bdg.fbo{background:var(--accent-soft);color:var(--accent)}
.bdg.fbs{background:var(--vio-soft);color:var(--vio)}
.bdg.ok{background:var(--up-soft);color:var(--up)}
.bdg.bad{background:var(--down-soft);color:var(--down)}
.bdg.wr{background:var(--warn-soft);color:var(--warn)}
.bdg.gr{background:var(--line2);color:var(--mut)}
.ct{display:inline-flex;align-items:center;height:15px;padding:0 4px;margin:0 1px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font:650 9px/1 var(--mono);vertical-align:2px;cursor:pointer;border:0}
.ct:hover{background:#D6E4F7}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{font:600 9.5px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:4.5px 6px;border-bottom:1px solid var(--line2);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .ttl{font-family:var(--sans);font-weight:550}
.tbl .pos{color:var(--up)}.tbl .neg{color:var(--down)}
.tbl .rowh{font:650 11px/1.3 var(--sans);background:var(--line2);color:var(--mut);text-transform:uppercase;font-size:9px;letter-spacing:.06em}
/* ---------- product rows ---------- */
.ptool{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.inp{flex:1 1 130px;min-width:0;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:450 12px/1 var(--sans);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
.sel{height:30px;padding:0 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:500 11.5px/1 var(--sans);color:var(--ink)}
.fchip{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:99px;background:var(--card);font:550 10.5px/1 var(--sans);color:var(--mut)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px;text-align:left;width:100%}
.prow:active{border-color:#C7CAC3}
.pthumb{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:650 12px/1 var(--mono);color:#fff}
.pmain{flex:1;min-width:0}
.pname{font:600 12px/1.25 var(--sans);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:10px;color:var(--faint);flex-wrap:wrap}
.pnums{display:flex;gap:12px;flex:none;align-items:center}
.pnum{text-align:right}
.pnum .a{font:600 12.5px/1.1 var(--mono);letter-spacing:-.02em}
.pnum .b{font:500 9.5px/1.2 var(--sans);color:var(--faint);margin-top:1px}
@media(max-width:560px){.pnum.opt{display:none}}
.chev{flex:none;color:#C0C3BC}
@media(min-width:760px){.plist{display:grid;grid-template-columns:1fr 1fr;gap:7px}}
@media(min-width:1280px){.plist{grid-template-columns:repeat(2,1fr)}}

/* ---------- fold (collapsible) ---------- */
details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font:600 12px/1.3 var(--sans);letter-spacing:-.01em}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .arr{flex:none;transition:transform .15s;color:var(--faint)}
details.fold[open]>summary .arr{transform:rotate(90deg)}
details.fold>summary .tag{margin-left:auto;font:500 9.5px/1 var(--sans);color:var(--faint);flex:none}
.fold-b{padding:2px 12px 11px;border-top:1px solid var(--line2)}
.fold-b p{font-size:11.5px;color:var(--mut);margin:8px 0;line-height:1.5}

/* ---------- formulas ---------- */
.formula{background:var(--line2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:8px 0;font:500 12px/1.6 var(--mono);color:var(--ink);overflow-x:auto;white-space:nowrap}
.formula i{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.formula .op{color:var(--accent)}
.ev{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:5px;font:650 9.5px/1 var(--mono)}
.ev.A{background:var(--up-soft);color:var(--up)}.ev.B{background:var(--warn-soft);color:var(--warn)}.ev.C{background:var(--line2);color:var(--mut)}

/* ---------- modal ---------- */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-root[hidden]{display:none}
/* perf v2.9: без backdrop-filter — blur на sticky-элементах перерисовывается на каждый кадр скролла (мобилки) */
.modal-backdrop{position:absolute;inset:0;background:rgba(18,20,24,.42)}
.modal{position:relative;width:100%;max-width:760px;max-height:88dvh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:0 0 18px;overscroll-behavior:contain}
.modal-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 14px 9px;background:var(--bg);border-bottom:1px solid var(--line)}
.modal-bar h2{font:650 14px/1.25 var(--sans);letter-spacing:-.015em;flex:1;min-width:0}
.modal-x{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.mbody{padding:10px 12px}
@media(min-width:760px){.modal{border-radius:14px;margin:5dvh auto}.modal-root{align-items:flex-start}}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcell{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px}
.mcell .l{font:600 9px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.mcell .v{font:600 13.5px/1.2 var(--mono);margin-top:3px;letter-spacing:-.02em}
.mcell .n{font:450 10px/1.3 var(--sans);color:var(--faint);margin-top:2px}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .card{flex:1 1 240px}
/* perf v2.9: ленивое отображение далёких карточек — быстрее скролл длинных страниц и модалки товара.
   Свёрнутые карточки исключены: contain-intrinsic-size дал бы ложный запас высоты. */
.card:not(.folded){content-visibility:auto;contain-intrinsic-size:auto 260px}
@media print{.card{content-visibility:visible!important;contain-intrinsic-size:auto!important}}
.mbody .pskel,.grid .pskel{height:150px;flex:1 1 100%;border:1px dashed var(--line);border-radius:12px;background:linear-gradient(100deg,#EEF0EA 40%,#F8F9F5 50%,#EEF0EA 60%);background-size:200% 100%;animation:skel 1.2s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.pskel{animation:none}}
/* кнопки-стратегии калькулятора заказа (openOrderHow) */
.ohrow{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 2px}
.ohb{flex:1 1 96px;min-height:32px;border:1px solid var(--line);background:var(--card);border-radius:9px;font:600 11px/1.2 var(--sans);color:var(--ink);cursor:pointer;padding:6px 9px;text-align:left}
.ohb small{display:block;font:500 9.5px/1.25 var(--sans);color:var(--faint);margin-top:2px}
.ohb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ohb.on small{color:rgba(255,255,255,.75)}
.ohline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2);font:450 11.5px/1.35 var(--sans)}
.ohline:last-child{border-bottom:0}
.ohline .ov{font:650 12px/1.2 var(--mono);white-space:nowrap}
.ohline .ol{color:var(--mut);min-width:0}
.ohline.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:7px}
.ohline.total .ol{color:var(--ink);font-weight:650}
.ohline.total .ov{font-size:14px}

/* ---------- lists / misc ---------- */
.refitem{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:11px;line-height:1.4}
.refitem:last-child{border-bottom:0}
.refitem .rn{flex:none;font:650 10px/1.5 var(--mono);color:var(--accent);min-width:26px}
.refitem .rt a{color:var(--ink)}
.refitem .rt .rh{color:var(--faint);font-size:10px}
.type-tag{display:inline-block;height:14px;padding:0 5px;margin-right:4px;border-radius:4px;background:var(--line2);color:var(--mut);font:600 8.5px/14px var(--sans);letter-spacing:.03em;vertical-align:1px}
.type-tag.journal{background:var(--accent-soft);color:var(--accent)}
.type-tag.industry{background:var(--warn-soft);color:var(--warn)}
.type-tag.media{background:var(--vio-soft);color:var(--vio)}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px;font-size:10px;color:var(--mut)}
.legend .li{display:flex;align-items:center;gap:4px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.note{font-size:10.5px;color:var(--faint);line-height:1.45;margin-top:7px}
.hl-flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:#FCEFC7}100%{background:transparent}}
.evrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.evrow:last-child{border-bottom:0}
.evrow .en{flex:1;min-width:0}
.evrow .ed{font:500 10px/1 var(--sans);color:var(--faint)}
.evrow .el{font:650 11px/1 var(--mono)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font:500 12px/1.4 var(--sans);max-width:88vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.field{margin:8px 0}
.field label{display:block;font:600 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:4px}
.field .inp{width:100%}
.expbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;text-align:left}
.expbtn:active{background:var(--line2)}
.expbtn .ei{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 9.5px/1 var(--mono);color:#fff}
.expbtn .et b{display:block;font:600 12px/1.3 var(--sans)}
.expbtn .et i{font-style:normal;font-size:10px;color:var(--faint)}
.retbar{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);margin:3px 0}
.retbar .bar{height:9px;border-radius:4px;background:var(--accent);opacity:.85}

/* ---------- v2.2 · плавность ---------- */
.tbtn,.fchip,.expbtn,.selc-btn,.hintbtn,.seg button,.selc-opt{transition:background .15s ease,border-color .15s ease,color .15s ease}
.prow,.kpi,.mcell,.card{transition:border-color .15s ease}
@media(hover:hover){.prow:hover{border-color:#C7CAC3}.kpi:hover{border-color:#C7CAC3}}
.tab.on{animation:tabFade .18s ease}
@keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- v2.2 · модалка: анимация появления ---------- */
.modal-root{animation:fadeIn .18s ease}
.modal{animation:mUp .24s cubic-bezier(.2,.7,.3,1)}
@keyframes mUp{from{transform:translateY(28px);opacity:.35}to{transform:none;opacity:1}}
@media(min-width:760px){.modal{animation-name:mPop}.modal-root{animation-duration:.15s}}
@keyframes mPop{from{transform:translateY(12px) scale(.98);opacity:.4}to{transform:none;opacity:1}}

/* ---------- v2.2 · KPI: значение и спарклайн в одной строке ---------- */
.kpi .vr{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:3px;min-width:0}
.kpi .v{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;position:relative;z-index:1}
.kpi .spark2{flex:none;opacity:.5;position:relative;z-index:1}
.kpi .spark2 svg{max-width:42px}
.kpi .d{position:relative;z-index:1}
.kpi .spark{right:8px;bottom:22px;opacity:.5}

/* ---------- v2.2 · card-h: sub не переносится, а укорачивается ---------- */
.card-h h3{flex:0 0 auto}
.card-h .sub{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{row-gap:4px}
.legend+.mgrid,.legend+.note{margin-top:9px}

/* ---------- v2.2 · дельты: вверх зелёный, вниз красный (везде) ---------- */
.up{color:var(--up)}
.dn{color:var(--down)}
.fl{color:var(--faint)}

/* ---------- v2.2 · скролл-обёртки для таблиц/графиков на узких экранах ---------- */
main{overflow-x:clip}
.grid>.card,.grid>details.fold{min-width:0}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px 0}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollx>svg,.scrollx>div{min-width:300px}

/* ---------- v2.2 · кастомный селектор ---------- */
.selc{position:relative;display:inline-block}
.selc-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:500 11.5px/1 var(--sans);color:var(--ink);max-width:230px}
.selc-btn .lv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.selc-btn svg{flex:none;color:var(--faint);transition:transform .18s ease}
.selc.open .selc-btn{border-color:var(--accent)}
.selc.open .selc-btn svg{transform:rotate(180deg)}
.selc-pop{position:absolute;top:calc(100% + 4px);right:0;min-width:190px;max-width:290px;max-height:268px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,22,26,.14);z-index:130;padding:4px;animation:fadeIn .14s ease}

.selc-opt:hover{background:var(--line2)}

.hintbtn{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--faint);font:650 9.5px/1 var(--sans);background:var(--card);margin-left:2px;vertical-align:1px}

.hintpop{position:fixed;z-index:150;width:min(310px,88vw);background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 34px rgba(20,22,26,.17);padding:11px 13px;animation:hpIn .16s ease}

.hintpop h4{font:650 12.5px/1.3 var(--sans);margin-bottom:5px;padding-right:18px}

.hintpop .hp-lab{font:650 8.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-top:7px}
.hintpop .hp-x{position:absolute;top:8px;right:8px;color:var(--faint)}
.tipbox{position:fixed;z-index:160;pointer-events:none;background:var(--ink);color:#fff;padding:6px 9px;border-radius:8px;font:500 10.5px/1.45 var(--sans);max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.28);white-space:pre-line}
.tipbox .tb{color:#D9A21B}

/* ---------- v2.2 · сегмент-контрол, слайдеры, теги ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:6px;font:550 10.5px/1 var(--sans);color:var(--mut)}
.seg button.on{background:var(--ink);color:#fff}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline:none;margin:6px 0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.22);cursor:pointer}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.22);cursor:pointer}
.tagchip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:99px;background:var(--line2);color:var(--mut);font:550 9.5px/1 var(--sans);border:1px solid transparent;white-space:nowrap}
.tagchip.auto{background:transparent;border-color:var(--line);color:var(--faint)}
.tagchip.on{background:var(--accent-soft);color:var(--accent);border-color:#C5D8F0}
.tagchip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tagchip .x{font:650 10px/1 var(--sans);color:inherit;opacity:.6;padding:0 1px}
.tagchip .x:hover{opacity:1}
.tagadd{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;border:1px dashed var(--line);color:var(--faint);font:550 9.5px/1 var(--sans);background:none}
.dirbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut)}
.dirbtn.on{color:var(--accent);border-color:#A9C4E8;background:var(--accent-soft)}

/* ---------- v2.2 · акцентные ячейки метрик ---------- */
.mcell.acc{border-left:3px solid var(--accent)}
.mcell.acc .v{font-size:16.5px}
.mcell.acc-g{border-left-color:var(--up)}
.mcell.acc-o{border-left-color:#B3701E}
.mcell.acc-v{border-left-color:var(--vio)}
.mcell.acc-r{border-left-color:var(--down)}

/* ---------- v2.2 · учёт: сотрудники, группы, документы ---------- */
.emprow{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)}
.emprow:last-child{border-bottom:0}
.emprow .ec{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font:650 11px/1 var(--mono);color:#fff}
.emprow .en2{font:600 12px/1.3 var(--sans)}
.emprow .er{font:450 10.5px/1.35 var(--sans);color:var(--faint)}
.emprow .em{margin-left:auto;text-align:right;flex:none}
.emprow .em .a{font:600 12.5px/1.1 var(--mono)}
.emprow .em .b{font:500 9.5px/1.2 var(--sans);color:var(--faint)}
.sched{display:inline-flex;gap:2px;margin-top:3px}
.sched i{font:600 8px/1 var(--sans);font-style:normal;width:13px;height:13px;display:grid;place-items:center;border-radius:3px;background:var(--line2);color:var(--faint)}
.sched i.w{background:var(--accent-soft);color:var(--accent)}
.docrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.docrow:last-child{border-bottom:0}
.docrow .di{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:650 7px/1 var(--mono);color:#fff}
.docrow .dn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow .ds{font:450 9.5px/1 var(--sans);color:var(--faint)}
.filelbl{display:inline-flex;align-items:center;gap:5px}
.filelbl input[type=file]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.vrow:last-child{border-bottom:0}
.vrow .vb{height:8px;border-radius:4px;background:var(--accent);opacity:.8}
.vrow .vn{flex:none;min-width:74px;font-weight:550}
.vrow .vs{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--mut);text-align:right;flex:none}

/* ================= v2.3 · защита от вылезаний (карточки/селекторы/строки) ================= */
.card-h{flex-wrap:wrap;row-gap:4px}
.card-h .selc{flex:0 1 auto;min-width:0;margin-left:auto}
.modal-bar h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{overflow-wrap:anywhere}
.mgrid,.mrow,.emprow,.docrow,.vrow,.mcell{min-width:0}

.emprow .er{overflow-wrap:anywhere}
.emprow .em{max-width:46%;min-width:0}
.emprow .em .a{white-space:nowrap}
.emprow .em .b{white-space:normal;font-size:9px;line-height:1.3;color:var(--faint);margin-top:1px}
.vrow{flex-wrap:wrap;row-gap:2px}
.vrow .vs{max-width:100%}
@media(max-width:600px){
  .selc-btn{max-width:52vw}

  .tbl{font-size:10.5px}
  .tbl th{font-size:8.5px;padding:4px 4px}
  .tbl td{padding:4px 4px}
  .kpi{flex:0 0 136px}
}
/* селектор в шапке карточки «Финансы»: не вылезает вправо */
@media(max-width:600px){.card-h .selc{width:100%;margin-left:0}.card-h .selc .selc-btn{width:100%;max-width:100%}}

/* ================= v2.3 · редизайн карточки товара ================= */
.prow{align-items:stretch;gap:10px;padding:9px 11px}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column}
.pline1{display:flex;align-items:flex-start;gap:7px;min-width:0}
.pname{flex:1;min-width:0;font:600 12.5px/1.32 var(--sans);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.pline1 .up,.pline1 .dn{font:550 10.5px/1 var(--mono);flex:none;margin-top:2px;white-space:nowrap}
.pline2{display:flex;align-items:center;gap:5px;margin-top:2.5px;font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
.pline2 .bdg{flex:none}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}
.pst{min-width:0}
.pst b{display:block;font:600 12px/1.15 var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst i{display:block;font:500 8.5px/1.25 var(--sans);font-style:normal;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pline4{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:16px;flex-wrap:wrap}
.pspark{flex:none;opacity:.85;display:block}
@media(max-width:560px){.pnum.opt{display:none}.pnums{gap:8px}}

/* ================= v2.3 · планировщик пополнения ================= */
.urg{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:5px;font:650 9px/1 var(--sans);letter-spacing:.03em;white-space:nowrap}

/* ================= v2.3 · размерная кривая ================= */
.sclab{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin:10px 0 3px}
.sclab .t{font:600 9.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.type-tag.book{background:#E4F0EE;color:#0F7B8A}

/* ================= v2.3 · селектор: подстраховка от выхода за экран ================= */
.selc{max-width:100%;min-width:0}
.selc-btn{max-width:100%}
.selc-pop{max-width:min(290px,92vw)}

/* ================= v2.5 · субвкладки «Товары»: Общая / Группы / Пополнение ================= */
.ptabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:3px;margin:0 0 9px;width:100%;box-shadow:var(--shadow)}

.ptab .n{font:500 9px/1 var(--mono);opacity:.6;flex:none}

.ptab.on{background:var(--ink);color:#fff}
.ptab.on .n{opacity:.75}
/* строка сортировки: селект + кнопка направления — всегда на одной линии */
.sortwrap{display:flex;gap:6px;flex:1 1 240px;min-width:0}
.sortwrap .selc{flex:1 1 auto;min-width:0}
.sortwrap .selc .selc-btn{width:100%;max-width:100%}
/* мини-статы под фото: рейтинг, отзывы, заказы/24ч, Δостатка/24ч */
.pcol{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:4px}

.pmini .up{color:var(--up)}.pmini .dn{color:var(--down)}
/* инпуты внутри сеток/карточек не вылезают за пределы страницы */
.mcell .inp,.mgrid .inp,.fold-b .inp{width:100%;min-width:0;max-width:100%}
input,select,textarea{max-width:100%}
/* v2.7: ячейка-мини-карточка не даёт длинным токенам вылезать за границу */
.mcell{min-width:0}
.mcell .l,.mcell .n{overflow-wrap:break-word;word-break:break-word;min-width:0}
/* v2.7: 4 ячейки в ряд только на широких экранах, на мобиле — 2×2
   (бывшие inline repeat(4,1fr) выдавливали текст из мини-карточек) */
.mgrid.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.mgrid.g4{grid-template-columns:repeat(4,1fr)}}

/* ================= v2.6 · сворачиваемые секции (каждая карточка) =================
   Свёрнутая секция — одна линия: заголовок + полезная сводка (data-fsum / FOLD_SUM).
   Шеврон справа; клик по строке заголовка тоже сворачивает/разворачивает. */
.card>.card-h{cursor:default}
.card[data-fid]>.card-h{cursor:pointer}
.card .chev{flex:none;width:18px;height:18px;margin-left:2px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:color .15s,border-color .15s}
.card[data-fid]>.card-h:hover .chev{color:var(--ink);border-color:var(--mut)}
.card .chev svg{transition:transform .16s ease}
.card.folded .chev svg{transform:rotate(-90deg)}
.card .fsum{display:none}
.card.folded{padding-bottom:11px}
.card.folded>.card-h{margin-bottom:0}
.card.folded>.card-h .sub{display:none}
.card.folded>.card-h .sp{display:none}
/* v2.7: в свёрнутой карточке шапка показывает только заголовок, шеврон и сводку —
   чипы периода/«прогноз», селекты и прочие контролы из card-h скрываются */
.card.folded>.card-h>:not(h3):not(.chev):not(.fsum){display:none!important}
.card.folded>.card-h .fsum{display:block;flex:1 1 150px;min-width:0;text-align:right;font:500 10.5px/1.35 var(--mono);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.card.folded>:not(.card-h){display:none!important}
/* печать: свёрнутые секции раскрываются — PDF/распечатка всегда полная */
@media print{
  .card.folded>:not(.card-h){display:revert!important}
  .card.folded>.card-h .sub{display:block!important}
  .card.folded>.card-h .fsum{display:none!important}
  .card.folded>.card-h{flex-wrap:wrap!important}
  .card .chev{display:none!important}
}

/* ---------- v2.3 · IndexedDB для документов ----------
   В localStorage влезало ~180 КБ на файл; IDB снимает ограничение —
   храним и метаданные, и содержимое файлов (до десятков МБ, оффлайн). */
const IDB=(function(){
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      const rq=indexedDB.open('sa-docs',1);
      rq.onupgradeneeded=()=>{const db=rq.result;
        if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'id'});};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
    return dbp;
  }
  async function put(doc){const db=await open();return new Promise((res,rej)=>{
    const tx=db.transaction('docs','readwrite');
    tx.objectStore('docs').put(doc);
    tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
  async function all(){const db=await open();return new Promise((res,rej)=>{
    const rq=db.transaction('docs','readonly').objectStore('docs').getAll();
    rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});}
  async function del(id){const db=await open();return new Promise((res,rej)=>{
    const tx=db.transaction('docs','readwrite');
    tx.objectStore('docs').delete(id);
    tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}
  return {put,all,del};
})();

const DATA=(function(){
  const dates=[]; for(let i=HIST_DAYS-1;i>=0;i--) dates.push(dAdd(TODAY,-i));
  const doy=d=>{const s=new Date(d.getFullYear(),0,0);return Math.round((d-s)/DAY);};

  const products=PRODUCTS.map(p=>{
    const cfg={...p};
    // недельный профиль с индивидуальным дрожанием
    const jitter=[0,1,2,3,4,5,6].map(()=> (rnd()-0.5)*0.06);
    cfg.dowF=[0.92,0.90,0.96,1.02,1.08,1.16,1.11].map((v,i)=>v+jitter[i]);
    cfg.annPhase=rnd()*6.283; cfg.annPhase2=rnd()*6.283; cfg.driftPhase=rnd()*6.283; cfg.promoQ=0.95+rnd()*0.35;
    // OOS-окна: 2–4 периода дефицита за 2 года
    cfg.oosIdx=new Set();
    const nWin=rndi(2,4);
    for(let w=0;w<nWin;w++){const s=rndi(60,690),len=rndi(2,9);for(let k=0;k<len;k++)cfg.oosIdx.add(s+k);}
    if(rnd()<0.15){const s=HIST_DAYS-rndi(4,10),len=rndi(2,3);for(let k=0;k<len;k++)cfg.oosIdx.add(s+k);} // редкий недавний OOS
    // плавный прайс-дрейф (конкурентные индексации) + один шаг репрайсинга — иначе η не идентифицируется
    cfg.stepT=rndi(400,700); cfg.stepV=(rnd()<0.5?-1:1)*(0.03+rnd()*0.03);
    // индекс цены: days of non-compliance (old_price < index)
    cfg.riskDays=rndi(0,14);
    cfg.searchImp=p.pos<=4?rndi(9000,24000):rndi(2200,9000); // показы в поиске/сутки
    cfg.stock=rndi(90,320); cfg.avgStkDays=28+rndi(4,22);
    return cfg;
  });

  const store={rev:[],units:[],unitsOrd:[],ads:[],returnsU:[],fun:{imp:[],vis:[],cart:[],ord:[]},oosShare:[]};
  const N=HIST_DAYS;

  products.forEach(p=>{
    p.series={units:[],sold:[],retU:[],price:[],promo:[],oos:[],rev:[],ads:[],checks:[]};
    for(let t=0;t<N;t++){
      const d=dates[t];
      const trendF=Math.pow(1.00028,t);
      const dowF=p.dowF[wdIdx(d)];
      const doyv=doy(d)/365.25;
      const annF=1+p.ann*(0.60*Math.sin(2*Math.PI*doyv+p.annPhase)+0.40*Math.sin(4*Math.PI*doyv+p.annPhase2));
      const evF=eventFactor(d,p.cat);
      const drift=1+0.06*Math.sin(2*Math.PI*t/97+p.driftPhase)+(t>p.stepT?p.stepV:0);
      const promo=inPromo(d);
      const price=Math.round(p.price*drift*(promo?(1-p.disc):1));
      const promoF=promo? Math.pow(1-p.disc, p.ela)*p.promoQ : 1;
      const priceF=Math.pow(drift, p.ela);
      const oos=p.oosIdx.has(t);
      const noiseF=Math.exp(gauss()*0.14);
      let units=oos?0:p.base*trendF*dowF*annF*evF*promoF*priceF*noiseF;
      units=Math.max(0,Math.round(units));
      const sold=Math.round(units*p.buyout);
      const retU=Math.round(sold*p.ret*Math.exp(gauss()*0.08));
      const rev=sold*price;
      const ads=rev*p.ads*(promo?1.55:1);
      p.series.units.push(units); p.series.sold.push(sold); p.series.retU.push(retU);
      p.series.price.push(price); p.series.promo.push(promo?1:0); p.series.oos.push(oos?1:0);
      p.series.rev.push(rev); p.series.ads.push(ads);
    }

    /* ---- v2.6 · потоварная воронка: показы → визиты → корзины → заказы → выкупы.
         Заказы = units/1.14 (штук в отправлении, как в магазине); конверсии SKU-специфичные:
         CTR зависит от позиции в поиске, визит→корзина и корзина→заказ — профиль категории,
         OOS-дни давят конверсию (покупатель уходит к конкуренту). Обратная свёртка от заказов. ---- */
    p.series.fu={imp:[],vis:[],cart:[],ord:[]};
    const ctrP=0.018+rnd()*0.02+(p.pos<=3?0.010:p.pos<=6?0.004:0);
    const cvcP=0.100+rnd()*0.05;
    const ccoP=0.30+rnd()*0.12;
    for(let t=0;t<N;t++){
      const ord=Math.max(0,Math.round(p.series.units[t]/1.14));
      const oosF=p.series.oos[t]?0.55:1;
      const vis=Math.max(ord,Math.round(ord/(cvcP*ccoP*oosF*(1+gauss()*0.03))));
      const cart=Math.round(vis*cvcP*(1+gauss()*0.02));
      const imp=Math.round(vis/(ctrP*(1+gauss()*0.02)));
      p.series.fu.ord.push(ord); p.series.fu.vis.push(vis); p.series.fu.cart.push(cart); p.series.fu.imp.push(imp);
    }

    // текущие остатки и стоимость запаса
    p.invValue=p.stock*p.cogs;

    /* ---- v2.2 · история себестоимости: закупочные цены меняются (курс, сырьё) ---- */
    p.cogsHist=[];
    let ch=p.cogs*(1+(rnd()*0.22-0.09));
    const chT=[];const chN=rndi(2,4);
    for(let k=0;k<chN;k++)chT.push(rndi(60,HIST_DAYS-45));
    chT.sort((a,b)=>a-b);
    chT.forEach(t=>{ch=ch*(1+(rnd()*0.11-0.045));p.cogsHist.push({t,iso:dISO(dates[t]),c:Math.max(15,Math.round(ch))});});
    p.cogsHist.push({t:HIST_DAYS-1,iso:dISO(dates[HIST_DAYS-1]),c:p.cogs});

    /* ---- v2.2 · варианты карточки.
         У Ozon одна карточка может объединять и размеры/цвета одного товара,
         и комплектации, и вообще разные товары. Статистика по вариантам
         отвечает на вопрос «какой размер/цвет/комплектация ходовой». ---- */
    const sold30=sum(p.series.sold.slice(-30));
    let vdef;
    if(p.offer_id.startsWith('SNKR'))      vdef={g:'размер',items:['38','39','40','41','42','43','44'],bell:2.4,ctr:3};
    else if(p.offer_id.startsWith('HOOD')) vdef={g:'размер × цвет',items:['S · графит','M · графит','L · графит','XL · графит','M · синий','L · беж','XL · беж','XXL · графит'],bell:2.0,ctr:2.5};
    else if(p.offer_id.startsWith('MAGS')) vdef={g:'исполнение',items:['белый','чёрный','силикон · чёрный']};
    else if(p.offer_id.startsWith('ROBOT'))vdef={g:'комплектация',items:['базовая','+ запасная щётка','Pro · лидар+моп']};
    else if(p.offer_id.startsWith('COFFEE'))vdef={g:'объём',items:['1 кг × 2','1 кг × 4']};
    else if(p.offer_id.startsWith('SERUM'))vdef={g:'объём',items:['30 мл','50 мл']};
    else if(p.offer_id.startsWith('POTS')) vdef={g:'комплектация',items:['3 предмета','5 предметов','5 пред. + ковш']};
    else if(p.offer_id.startsWith('LED'))  vdef={g:'цвет корпуса',items:['белый','чёрный','серый']};
    else if(p.offer_id.startsWith('CONST'))vdef={g:'набор',items:['420 деталей','840 деталей']};
    else if(p.offer_id.startsWith('VITD3'))vdef={g:'объём',items:['120 капсул','240 капсул']};
    else if(p.offer_id.startsWith('TAB'))  vdef={g:'формат',items:['A4','A5 + перо']};
    else if(p.offer_id.startsWith('MUG'))  vdef={g:'объём',items:['450 мл','600 мл']};
    else                                   vdef={g:'объём',items:['250 мл','400 мл']};
    const nV=vdef.items.length;
    let wsum=0;const wts=vdef.items.map((lb,i)=>{
      let w=1;
      if(vdef.bell)w=Math.exp(-Math.pow(Math.abs(i-vdef.ctr),1.6)/vdef.bell)*(0.75+rnd()*0.5);
      else w=(i===0?1:0.45+rnd()*0.35)*(i===0?1:1);
      if(i!==0&&rnd()<0.5)w*=0.55+rnd()*0.4;
      wsum+=w;return w;});
    p.variants=vdef.items.map((lb,i)=>{
      const share=wts[i]/wsum;
      return {label:lb,dim:vdef.g,share,units30:Math.max(0,Math.round(sold30*share)),
              ret:Math.max(0.004,p.ret*(0.65+rnd()*0.9)),
              stock:Math.max(0,Math.round(p.stock*share*(0.55+rnd()*0.9))),
              kind:'вариант'};
    });
    p.cardGroup=vdef.g;
    p.cardTop=p.variants.reduce((a,b)=>b.units30>a.units30?b:a).label;
    /* «другой товар» в одной карточке — реальный кейс Ozon (в довесок / под одной карточкой) */
    if(p.offer_id.startsWith('MAGS')){
      p.variants.push({label:'Стекло защитное iPhone 15',dim:'другой товар',share:0.10,units30:Math.round(sold30*0.11),ret:0.021,stock:64,kind:'другой товар'});
    }
    if(p.offer_id.startsWith('TAB')){
      p.variants.push({label:'Перо запасное (стилус)',dim:'другой товар',share:0.08,units30:Math.round(sold30*0.09),ret:0.015,stock:41,kind:'другой товар'});
    }
  });

  /* v2.2: правки себестоимости из localStorage — применяются до расчётов */
  (function(){
    const ov=LS.get('cogs',{});if(!ov)return;
    products.forEach(p=>{const arr=ov[p.sku];if(arr&&arr.length){
      p.cogsHist=arr.map(h=>{const t=dates.findIndex(d=>dISO(d)===h.iso);return {t:t<0?HIST_DAYS-1:t,iso:h.iso,c:h.c};}).sort((a,b)=>a.t-b.t);
      p.cogs=p.cogsHist[p.cogsHist.length-1].c;p.invValue=p.stock*p.cogs;}});
  })();

  // агрегаты магазина
  for(let t=0;t<N;t++){
    let rev=0,units=0,unitsOrd=0,ads=0,retU=0,oos=0;
    products.forEach(p=>{rev+=p.series.rev[t];units+=p.series.sold[t];unitsOrd+=p.series.units[t];ads+=p.series.ads[t];retU+=p.series.retU[t];oos+=p.series.oos[t];});
    store.rev.push(rev); store.units.push(units); store.unitsOrd.push(unitsOrd);
    store.ads.push(ads); store.returnsU.push(retU); store.oosShare.push(oos/products.length);
    /* v2.6: воронка магазина = Σ потоварных воронок (было: обратная свёртка от orders —
       теперь магазин и SKU методологически согласованы) */
    let fImp=0,fVis=0,fCart=0,fOrd=0;
    products.forEach(p=>{fImp+=p.series.fu.imp[t];fVis+=p.series.fu.vis[t];fCart+=p.series.fu.cart[t];fOrd+=p.series.fu.ord[t];});
    store.fun.ord.push(Math.max(1,fOrd)); store.fun.vis.push(fVis); store.fun.cart.push(fCart); store.fun.imp.push(fImp);
  }

  /* ---- заказы за 45 дней (структура v4/posting) ---- */
  const CITIES=[['Москва',12.5],['Санкт-Петербург',6.8],['Новосибирск',3.1],['Екатеринбург',3.0],['Казань',2.6],['Нижний Новгород',2.4],['Челябинск',2.1],['Красноярск',1.8],['Самара',1.7],['Уфа',1.7],['Ростов-на-Дону',1.6],['Краснодар',1.6],['Воронеж',1.3],['Пермь',1.2],['Волгоград',1.2]];
  const cityPool=[]; CITIES.forEach(c=>{for(let i=0;i<c[1];i++)cityPool.push(c[0]);});
  const STATUSES=[['delivered',0.80],['delivering',0.07],['awaiting_deliver',0.07],['cancelled',0.06]];
  const statusPool=[]; STATUSES.forEach(s=>{for(let i=0;i<s[1]*100;i++)statusPool.push(s[0]);});
  const ORD_WINDOW=45;
  const orders=[];
  let seq=41820;
  for(let t=N-ORD_WINDOW;t<N;t++){
    const d=dates[t];
    products.forEach(p=>{
      let n=Math.round(p.series.units[t]/1.14);
      for(let k=0;k<n;k++){
        seq++;
        const qty=RND()<0.85?1:(RND()<0.8?2:3);
        const price=p.series.price[t];
        const status=statusPool[Math.floor(RND()*statusPool.length)];
        const lag=p.scheme==='FBO'?16:9;
        const dd=p.scheme==='FBO'?rndi(1,2)+(RND()<0.25?1:0):rndi(2,6);
        orders.push({
          posting_number:'0003-0'+seq, order_id:4821000000+seq*7,
          sku:p.sku, offer_id:p.offer_id, name:p.name, scheme:p.scheme,
          in_process_at:dISO(d), shipment_date:dISO(dAdd(d,1)),
          payout_date:dISO(dAdd(d,lag)),
          status, cancel_reason:status==='cancelled'?pick(['buyer_canceled','not_paid','delivery_failed']):null,
          products:[{sku:p.sku, quantity:qty, price:price, commission_amount:Math.round(price*p.comm*qty), payout:Math.round(price*qty*(1-p.comm))}],
          analytics_data:{delivery_city:cityPool[Math.floor(RND()*cityPool.length)], delivery_days:dd},
          is_promo:p.series.promo[t]===1,
          financial_data:{price_total:price*qty, commission_total:Math.round(price*p.comm*qty), logistics_total:p.log*qty, payout_total:Math.round(price*qty*(1-p.comm))}
        });
      }
    });
  }
  orders.sort((a,b)=> a.in_process_at<b.in_process_at?-1:1);

  /* ---- предстоящие выплаты (график Ozon: FBO T+16, FBS T+9) ---- */
  const payMap=new Map();
  for(let t=N-24;t<N;t++){
    const d=dates[t];
    products.forEach(p=>{
      const lag=p.scheme==='FBO'?16:9;
      const pd=dAdd(d,lag), key=dISO(pd);
      if(pd>=TODAY){
        const cur=payMap.get(key)||{date:pd,fbo:0,fbs:0};
        const amt=p.series.rev[t];
        if(p.scheme==='FBO')cur.fbo+=amt; else cur.fbs+=amt;
        payMap.set(key,cur);
      }
    });
  }
  const payouts=[...payMap.values()].sort((a,b)=>a.date-b.date).slice(0,8);

  /* ---- v2.6 · когорты повторных покупок ПО КАЖДОМУ SKU (синтетика) + агрегат магазина.
     Ozon не отдаёт продавцу идентичность покупателя (он принадлежит платформе), поэтому
     удержание оценивается модельно: кривая удержания профиля категории × шум.
     Расходники (кофе/косметика/витамины) возвращаются часто, электроника и одежда — редко.
     Магазинная матрица = взвешенное среднее потоварных (согласованность уровней). ---- */
  const REPEAT_F={
    'COFF':2.30,'SERU':2.10,'VITD':2.40,'SHMP':2.25,       /* расходники */
    'MAGS':1.25,'CONS':1.15,'MUG-':0.95,'LED-':0.85,       /* средние */
    'POTS':0.70,'TWS-':0.55,'TAB-':0.60,'ROBO':0.45,       /* длинный цикл */
    'SNKR':0.38,'HOOD':0.42                                 /* fashion: возвращаются редко */
  };
  const BASE_RET=[1,0.31,0.21,0.155,0.12,0.095];
  const cohLabels=[];
  for(let c=5;c>=0;c--){
    const dt=new Date(TODAY.getFullYear(),TODAY.getMonth()-c,1);
    cohLabels.push(`${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}`);
  }
  products.forEach(p=>{
    const f=REPEAT_F[p.offer_id.slice(0,4)]||1.0;
    const moU=mean(p.series.units.slice(-180))/30.4||1; /* заказов/мес */
    const buyersMo=moU/1.14*0.82; /* ≈ уникальных покупателей/мес (мульти-заказы) */
    const curve=BASE_RET.map((v,k)=>k===0?1:Math.min(0.9,v*f));
    p.coh={labels:cohLabels,sizes:[],matrix:[]};
    for(let c=0;c<6;c++){
      const size=Math.max(8,Math.round(buyersMo*(0.85+rnd()*0.3)));
      p.coh.sizes.push(size);
      const row=[];
      for(let k=0;k<6;k++){
        /* возраст когорты c — (5−c) мес: c=0 самая старая, c=5 — текущий месяц.
           Наблюдаемы только клетки k ≤ возраста (M0 — сама первая покупка, ровно size человек) */
        row.push(k===0? size : (k<=5-c? Math.max(1,Math.round(size*curve[k]*Math.exp(gauss()*0.05))) : null));
      }
      p.coh.matrix.push(row);
    }
  });
  /* магазинная матрица — сумма потоварных СЧЕТОВ (размеры магазина = Σ SKU): тогда
   клетка/размер магазина = взвешенное среднее потоварных ставок удержания (согласованность) */
  const cohSizes=[],cohMatrix=[];
  for(let c=0;c<6;c++){
    const sz=sum(products.map(p=>p.coh.sizes[c]));
    cohSizes.push(sz);
    const row=[];
    for(let k=0;k<6;k++){
      row.push(k<=5-c? sum(products.map(p=>p.coh.matrix[c][k])) : null);
    }
    cohMatrix.push(row);
  }

/* ---- v2.8 · синтетическая база покупателей — честный BG/NBD-процесс (Fader–Hardie):
     интенсивность покупок λ ~ Gamma(r₀,α₀), вероятность ухода после покупки p ~ Beta(a₀,b₀).
     След покупок — НЕДЕЛЬНЫЙ (до 26 недель): этого достаточно, чтобы MLE идентифицировал уход.
     Параметры калиброваны под repeat rate магазина: RR M1 ≈ (1−e^{−λ_мес}) ≈ 30–35%; спад по месяцам
     — микс «живых/ушедших». Объёмы когорт = когортной матрице (аккаунты «товар × покупатель»). ---- */
const CRND=(()=>{let s=987654321;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};})();
const BGP={r:4.0,alpha:8.89,a:1.9,b:3.2};   /* λ_мес = r/α = 0,45 (CV 0,5); p = a/(a+b) ≈ 0,37 */
const gamSh=k=>{ /* Марсалья–Цанг, shape k, scale 1 */
  if(k<1){const u=CRND();return gamSh(1+k)*Math.pow(u,1/k);}
  const d=k-1/3,c=1/Math.sqrt(9*d);
  for(;;){let x,v;
    do{x=gauss();v=1+c*x;}while(v<=0);
    v=v*v*v;const u=CRND();
    if(u<1-0.0331*x*x*x*x)return d*v;
    if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;
  }
};
const pois=l=>{const L=Math.exp(-l);let k=0,p2=1;do{k++;p2*=CRND();}while(p2>L);return k-1;};
const customers=[];
products.forEach(p=>{
  for(let c=0;c<6;c++){
    for(let i=0;i<p.coh.sizes[c];i++){
      const lam=gamSh(BGP.r)/BGP.alpha/4.345;      /* недельная интенсивность */
      const g1=gamSh(BGP.a),g2=gamSh(BGP.b),pQuit=g1/(g1+g2);
      const KW=Math.round((5-c+1)*4.345);           /* недель наблюдения: 26…4 */
      let freq=1,lastW=0,dead=false;
      for(let w=1;w<=KW&&!dead;w++){
        const n=pois(lam);
        for(let j=0;j<n;j++){
          freq++;lastW=w;
          if(CRND()<pQuit){dead=true;break;}
        }
      }
      const lastK=lastW>0?Math.min(5-c,Math.floor((lastW-1)/4.345)):0; /* месяц последней покупки */
      const aov=Math.max(p.price*0.4,p.price*1.14*Math.exp(gauss()*0.25));
      customers.push({sku:products.indexOf(p),c,freq,lastK,lastW,KW,aov});
    }
  }
});

  
/* ---- v2.2 · налоги: режим налогообложения (пересчитывает маржу II по всему приложению) ---- */
const TAX_REGIMES=[
 {id:'npd',  label:'НПД · 4%',            rate:0.04, base:'выручка',  note:'самозанятость, лимит 2,4 млн ₽/год; без вычета расходов'},
 {id:'usn6', label:'УСН «Доходы» · 6%',   rate:0.06, base:'выручка',  note:'налог с выручки, расходы не учитываются'},
 {id:'usn15',label:'УСН «Д−Р» · 15%',     rate:0.15, base:'прибыль',  note:'налог с прибыли; минимальный налог 1% выручки'},
 {id:'osno', label:'ОСНО · 20% (прибыль)',rate:0.20, base:'прибыль',  note:'НДС 20% в демо-расчёте не учтён'}
];
const TAX=LS.get('tax',{regime:'usn6'});

      if(Math.abs(M[piv][c])<1e-12)continue;[M[c],M[piv]]=[M[piv],M[c]];

  /* Хольт-Уинтерс (аддитивные тренд и сезонность), перебор α/β/γ */
  function hwRun(y,m,al,be,ga){

      fit.push(pred);

      const nb=be*(nl-l)+(1-be)*b;
      const ns=ga*(y[t]-nl)+(1-ga)*si;

  /* KDE, правило Сильвермана */

  function holtRun(y,al,be){
    let l=y[0],b=(y[Math.min(6,y.length-1)]-y[0])/Math.min(7,y.length);const fit=[l];
    for(let t=1;t<y.length;t++){fit.push(l+b);const nl=al*y[t]+(1-al)*(l+b);b=be*(nl-l)+(1-be)*b;l=nl;}
    return {fit,l,b};
  }
  function holtFc(y,h){
    let best=null;
    for(let al=0.05;al<=0.4001;al+=0.05)for(let be=0.01;be<=0.2201;be+=0.03){const r=holtRun(y,al,be);
      let sse=0;for(let t=0;t<y.length;t++)sse+=(y[t]-r.fit[t])**2;
      if(!best||sse<best.sse)best={sse,l:r.l,b:r.b,al,be};}
    const fc=[];for(let i=1;i<=h;i++)fc.push(Math.max(0,best.l+i*best.b));
    return {fc,al:best.al,be:best.be};
  }
  /* Тета (θ=2): полусумма SES-прогноза тета-линии и линейной экстраполяции тренда
     Hyndman & Billah (2003) — упрощение классики Assimakopoulos–Nikolopoulos (2000) */
  function thetaFc(y,h){
    const n=y.length;
    let st=0,stt=0,sy=0,sty=0;
    for(let t=0;t<n;t++){st+=t;stt+=t*t;sy+=y[t];sty+=t*y[t];}
    const den=n*stt-st*st||1e-9;
    const b=(n*sty-st*sy)/den,a=(sy-b*st)/n;
    const th=y.map((v,t)=>2*v-(a+b*t));
    const ses=sesFc(th,h);
    const fc=[];for(let i=1;i<=h;i++)fc.push(Math.max(0,0.5*(ses.fc[i-1]+a+b*(n+i-1))));
    return {fc,al:ses.al,b};
  }
  const sNaiveFc=(y,m,h)=>{const n=y.length;return Array.from({length:h},(_,i)=>Math.max(0,y[n-m+(i%m)])||0);};
  const naiveFc=(y,h)=>new Array(h).fill(Math.max(0,y[y.length-1])||0);
  const driftFc=(y,h)=>{const n=y.length,d=n>1?(y[n-1]-y[0])/(n-1):0;
    return Array.from({length:h},(_,i)=>Math.max(0,y[n-1]+(i+1)*d));};
  /* комбо — простое среднее HW/SES/Тета/сезонный наивный (Бейтс–Гренджер 1969) */
  function combFc(y,m,h){
    const parts=[ST.hwForecast(y,m,h).fc,sesFc(y,h).fc,thetaFc(y,h).fc,sNaiveFc(y,m,h)];
    return Array.from({length:h},(_,i)=>Math.max(0,mean(parts.map(p=>p[i]))));
  }
  /* роллинг-бэктест всех моделей на тех же окнах, что и HW-бэктест.
     v2.8: +3 модели (SARIMA airline, «Prophet-стиль» DHR, Калман) — всего 11;
     errs[mi] — погрешности по дням всех окон, нужны для Диболда–Мариано. */
  function tournament(y,m,horizon,dates){
    const names=['Наивная','Сезонная наивная','Дрейф','SES','Хольт','Тета','Хольт-Уинтерс','Комбо (ср. 4-х)','SARIMA (0,1,1)(0,1,1)'+m,'Prophet-стиль (тренд+календарь)','Калман (уровень)'];
    const agg=names.map(()=>({ae:0,av:0,n:0,bias:0,bn:0}));
    const errs=names.map(()=>[]);
    const maseDen=(function(){let s=0,c=0;for(let i=m;i<y.length;i++){s+=Math.abs(y[i]-y[i-m]);c++;}return c?s/c:1;})();
    for(let k=0;k<3;k++){
      const cut=y.length-horizon-k*14;if(cut<m*4)break;
      const tr=y.slice(0,cut),te=y.slice(cut,cut+horizon);
      const d0=dates?dates[cut-1]:null;
      const sar=sarimaFc(tr,m,horizon);
      const dhr=dhrFc(tr,m,horizon,d0);
      const fcs=[naiveFc(tr,horizon),sNaiveFc(tr,m,horizon),driftFc(tr,horizon),sesFc(tr,horizon).fc,
                 holtFc(tr,horizon).fc,thetaFc(tr,horizon).fc,
                 (function(){const f=hwFit(tr,m);const out=[];for(let i=1;i<=horizon;i++)out.push(Math.max(0,f.l+i*f.b+f.s[(cut+i-1)%m]));return out;})(),
                 combFc(tr,m,horizon),
                 sar?sar.fc:sNaiveFc(tr,m,horizon),
                 dhr?dhr.fc:sNaiveFc(tr,m,horizon),
                 kalmanFc(tr,horizon).fc];
      fcs.forEach((fc,mi)=>{te.forEach((v,i)=>{agg[mi].ae+=Math.abs(v-fc[i]);agg[mi].av+=v;agg[mi].n++;agg[mi].bias+=fc[i]-v;agg[mi].bn++;errs[mi].push(v-fc[i]);});});
    }
    const rows=names.map((name,i)=>{const a=agg[i];
      return {name,wape:a.ae/Math.max(1,a.av),mase:(a.ae/Math.max(1,a.n))/maseDen,bias:a.bn?a.bias/a.bn:0};});
    const rowsSorted=rows.map((r,i)=>({...r,idx:i})).sort((a,b)=>a.wape-b.wape);
    const champ=rowsSorted[0];
    const comb=rows[7];
    return {rows,champ,comb,maseDen,errs};
  }
  /* sMAPE и RMSSE — доп. метрики для карточки качества (M5-конвенции) */
  function smapeRmsse(y,m,horizon){
    const cut=y.length-horizon;if(cut<m*4)return{smape:0,rmsse:1};
    const tr=y.slice(0,cut),te=y.slice(cut);
    const fc=combFc(tr,m,horizon);
    const smape=mean(te.map((v,i)=>Math.abs(v-fc[i])/((Math.abs(v)+Math.abs(fc[i]))/2||1e-9)));
    const mse=mean(te.map((v,i)=>(v-fc[i])**2));
    let ds=0,dc=0;for(let i=m;i<y.length;i++){ds+=(y[i]-y[i-m])**2;dc++;}
    return {smape,rmsse:dc?Math.sqrt(mse)/Math.sqrt(ds/dc):1};
  }

  /* v2.7 · CUSUM-карта: обнаружение сдвига уровня ряда (Page 1954).
     Вход — остатки декомпозиции; z нормируем; k=0,5σ (допуск), h=5σ (порог тревоги). */
  function cusum(resid,dates){
    const mu=mean(resid),sg=std(resid)||1;
    let sp=0,sm=0,upIdx=-1,dnIdx=-1;
    for(let t=0;t<resid.length;t++){
      const z=(resid[t]-mu)/sg;
      sp=Math.max(0,sp+z-0.5);sm=Math.max(0,sm-z-0.5);
      if(sp>5)  {upIdx=t;sp=0;}
      if(sm>5)  {dnIdx=t;sm=0;}
    }
    const last=upIdx>=dnIdx?upIdx:dnIdx;
    const since=last>=0?Math.round((resid.length-1-last)/30.4):null;
    return {upIdx,dnIdx,
      dir:last<0?0:(upIdx>=dnIdx?1:-1),
      date:last>=0?dates[Math.max(0,Math.min(dates.length-1,last))]:null,
      monthsAgo:since};
  }

  /* v2.7 · Croston (1972) + SBA (Syntetos–Boylan 2005) для прерывистого спроса */
  function croston(y,al){
    al=al||0.2;
    let q=0,z=0,qh=null,zh=null,interv=0;
    y.forEach(v=>{
      interv++;
      if(v>0){
        if(qh===null){q=v;z=interv;}
        else{q=al*v+(1-al)*q;z=al*interv+(1-al)*z;}
        qh=q;zh=z;interv=0;
      }
    });
    const rate=zh?qh/zh:0;
    return {rate,sba:rate*(1-al/2),nz:y.filter(v=>v>0).length,n:y.length,al};
  }
  /* классификация спроса Syntetos–Boylan по ADI и CV² (квадрат CV размеров) */
  function adiCV(y){
    const sizes=y.filter(v=>v>0);
    const nz=sizes.length;
    const adi=nz?y.length/nz:y.length||1;
    const cv2=nz>1?(std(sizes)/mean(sizes))**2:0;
    const cls=(adi>1.32? cv2>0.49?'L':'I' : cv2>0.49?'E':'S');
    const lab={S:'гладкий',E:'рваный',I:'прерывистый',L:'комковатый'}[cls];
    return {adi,cv2,cls,lab};
  }

  /* v2.7 · обратная функция нормального распределения (Аacklam) — квантиль z_p
     для newsvendor и уровней сервиса, отличных от табличных 90/95/98/99% */
  function qnorm(p){
    p=clamp(p,1e-6,1-1e-6);
    const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
    const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
    const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
    const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    const pl=0.02425;
    let q,r;
    if(p<pl){q=Math.sqrt(-2*Math.log(p));
      return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
    if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));
      return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
    q=p-0.5;r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }

  /* v2.7 · проекция удержания когорты: степенной закон r_k = a·k^(−b) (log-log OLS)
     по наблюдаемым M1..M5, проекция M6..M12 + ожидаемые заказы на покупателя за 12 мес */
  function retProj(rates){
    const xs=[],ys=[];
    rates.forEach((r,i)=>{const k=i+1;if(r>0.004&&r<1){xs.push(Math.log(k));ys.push(Math.log(r));}});
    if(xs.length<2)return{proj:[],b:0,a:0,r2:0,ord12:0};
    const f=olsFull(xs.map(x=>[x]),ys);
    const b=-f.beta[1],a=Math.exp(f.beta[0]);
    const proj=[];for(let k=6;k<=12;k++)proj.push(Math.min(1,a*Math.pow(k,-b)));
    const ord12=1+sum(rates.filter(r=>r>0))+sum(proj);
    return {proj,b,a,r2:f.r2,ord12};
  }

  /* ================= v2.8 · ПОЛНЫЙ АРСЕНАЛ МОДЕЛЕЙ (по запросу: «добавляй все модели») ================= */

  /* 1) SARIMA(0,1,1)(0,1,1)_m — «airline model» Бокса–Дженкинса:
        классика для дневных рядов ритейла. Двойная разность (сезонная → первая),
        МА-полином θ (день) × Θ (неделя) подбирается сеткой по SSE, прогноз — рекурсия. */
  function sarimaFc(y,m,h){
    const n=y.length;
    const w=[];for(let t=m;t<n;t++)w.push(y[t]-y[t-m]);          /* сезонная разность */
    const d=[];for(let i=1;i<w.length;i++)d.push(w[i]-w[i-1]);   /* первая разность */
    const T=d.length;if(T<m+3)return null;
    let best=null;
    for(let th=-0.8;th<=0.8001;th+=0.2)for(let TH=-0.8;TH<=0.8001;TH+=0.2){
      const e=new Array(T).fill(0);let sse=0;
      for(let t=0;t<T;t++){
        const pred=th*(t>0?e[t-1]:0)+TH*(t>=m?e[t-m]:0)+th*TH*(t>m?e[t-m-1]:0);
        const ee=d[t]-pred;sse+=ee*ee;e[t]=ee;
      }
      if(!best||sse<best.sse)best={sse,th,TH,e};
    }
    const th=best.th,TH=best.TH,E=best.e;
    const eat=k=> (k>=0&&k<T)? E[k]:0;
    const wE=w.slice();const fc=[];
    for(let s=0;s<h;s++){
      const dS=th*eat(T+s-1)+TH*eat(T+s-m)+th*TH*eat(T+s-m-1);   /* будущие e=0 */
      wE.push(wE[wE.length-1]+dS);                               /* w_{W+s} */
      const base=s<m?y[n-m+s]:fc[s-m];                           /* y_{n+s} = y_{n+s-m} + w */
      fc.push(Math.max(0,base+wE[wE.length-1]));
    }
    return {fc,th,TH};
  }

  /* 2) «Prophet-стиль» — динамическая гармоническая регрессия:
        OLS [тренд + годовые гармоники k=1..3 + будни + промо + события],
        прогноз — экстраполяция тренда с демпфированием φ=0,98 + проекция компонент.
        d0 — дата последнего дня ряда y. */
  function dhrFc(y,m,h,d0){
    const n=y.length;if(!d0||n<60)return null;
    const feats=dt=>{
      const doy=Math.round((dt-new Date(dt.getFullYear(),0,0))/DAY)+1;
      const w=wdIdx(dt);
      const row=[0, Math.sin(2*Math.PI*doy/365.25),Math.cos(2*Math.PI*doy/365.25),
                    Math.sin(4*Math.PI*doy/365.25),Math.cos(4*Math.PI*doy/365.25),
                    Math.sin(6*Math.PI*doy/365.25),Math.cos(6*Math.PI*doy/365.25)];
      for(let k=1;k<7;k++)row.push(w===k?1:0);
      row.push(inPromo(dt)?1:0);
      row.push(eventFactor(dt,'')-1);
      return row;
    };
    const X=[];
    for(let i=0;i<n;i++){const r=feats(dAdd(d0,i-(n-1)));r[0]=i;X.push(r);}
    const f=olsFull(X,y);
    const PHI=0.98;let damp=0;const damps=[];
    for(let j=1;j<=h;j++){damp+=Math.pow(PHI,j);damps.push(damp);}
    const fc=[];
    for(let j=1;j<=h;j++){
      const r=feats(dAdd(d0,j));r[0]=(n-1)+damps[j-1];
      let s=0;for(let a=0;a<r.length;a++)s+=r[a]*f.beta[a+1];
      fc.push(Math.max(0,f.beta[0]+s));
    }
    return {fc,r2:f.r2};
  }

  /* 3) Фильтр Калмана: локальный уровень (random-walk сигнал + шум наблюдения).
        Сетка по отношению шумов q; прогноз — последний отфильтрованный уровень. */
  function kalmanFc(y,h){
    const s=std(y)||1,yy=y.map(v=>v/s);
    let best=null;
    [1e-4,3e-4,1e-3,3e-3,1e-2,3e-2,0.1,0.3,1,3,10].forEach(q=>{
      let l=yy[0],P=1,sse=0;
      for(let t=1;t<yy.length;t++){
        const Pp=P+q,K=Pp/(Pp+1);
        sse+=(yy[t]-l)**2;
        l=l+K*(yy[t]-l);P=(1-K)*Pp;
      }
      if(!best||sse<best.sse)best={sse,l,q};
    });
    return {fc:new Array(h).fill(Math.max(0,best.l*s)),q:best.q};
  }

  /* 4) Льюнг–Бокс: остатки прогноза — белый шум? Q ~ χ²_K,
        хвост χ² через приближение Вильсона–Хильферти. */
  function ljungBox(resid,K){
    const n=resid.length,a=acf(resid,K);
    let Q=0;for(let k=1;k<=K;k++)Q+=(a.r[k-1]*a.r[k-1])/(n-k);
    Q*=n*(n+2);
    const z=(Math.cbrt(Q/K)-(1-2/(9*K)))/Math.sqrt(2/(9*K));
    return {Q,p:1-normCdf(z),K};
  }

  /* 5) Диболд–Мариано: значимо ли чемпион лучше сезонного наивного.
        d_t = e1²−e2², HAC-дисперсия (Ньюи–Уэст, лаг = m). */
  function dmTest(e1,e2,lag){
    const T=Math.min(e1.length,e2.length);if(T<8)return{dm:0,p:1,md:0,T:0};
    const d=[];for(let i=0;i<T;i++)d.push(e1[i]*e1[i]-e2[i]*e2[i]);
    const md=mean(d);
    let g0=0;for(let i=0;i<T;i++)g0+=(d[i]-md)**2;g0/=T;
    let hac=g0;
    for(let k=1;k<=lag;k++){let gk=0;for(let i=k;i<T;i++)gk+=(d[i]-md)*(d[i-k]-md);gk/=T;
      hac+=2*(1-k/(lag+1))*gk;}
    const dm=md/Math.sqrt(Math.max(1e-12,hac/T));
    return {dm,p:2*(1-normCdf(Math.abs(dm))),md,T};
  }

  /* 6) Калибровка квантилей: pinball-лосс τ=0,1/0,5/0,9 (% от уровня ряда)
        + эмпирическое покрытие CI80/CI95 на тех же роллинг-окнах, что и бэктест. */
  function quantCalib(y,m,horizon){
    let c80=0,c80n=0,c95=0,c95n=0;
    const pin={p10:0,p50:0,p90:0,n:0};let lvl=0;
    for(let k=0;k<3;k++){
      const cut=y.length-horizon-k*14;if(cut<m*4)break;
      const tr=y.slice(0,cut),te=y.slice(cut,cut+horizon);
      const f=hwFit(tr,m);
      const resid=tr.map((v,i)=>v-f.fit[i]);
      const sg=std(resid.slice(-120))||std(resid)||1;
      te.forEach((v,i)=>{
        const ctr=f.l+(i+1)*f.b+f.s[(cut+i)%m];
        const w=sg*Math.sqrt(1+i*0.06);
        const lo80=ctr-1.2816*w,hi80=ctr+1.2816*w,lo95=ctr-1.96*w,hi95=ctr+1.96*w;
        if(v>=lo80&&v<=hi80)c80++;c80n++;
        if(v>=lo95&&v<=hi95)c95++;c95n++;
        const pb=(tau,q)=>(v<q?(1-tau)*(q-v):tau*(v-q));   /* пинбол-лосс ≥ 0: фикс знака v2.8 */
        pin.p10+=pb(0.1,Math.max(0,lo80));pin.p50+=pb(0.5,ctr);pin.p90+=pb(0.9,hi80);
        pin.n++;lvl+=Math.abs(v)||1;
      });
    }
    lvl=Math.max(1,lvl/Math.max(1,pin.n));
    return {cov80:c80n?c80/c80n:0,cov95:c95n?c95/c95n:0,
            pin10:pin.p10/pin.n/lvl,pin50:pin.p50/pin.n/lvl,pin90:pin.p90/pin.n/lvl};
  }

  /* 7) Байесовский интервал конверсии (априор Джеффриса):
        p̂=(k+0,5)/(n+1), 95% CI из нормальной аппроксимации бета-распределения. */
  function bbinom(k,n){
    if(!n)return {p:0,lo:0,hi:0};
    const p=(k+0.5)/(n+1);
    const se=Math.sqrt(Math.max(1e-12,p*(1-p)/(n+1)));
    return {p,lo:Math.max(0,p-1.96*se),hi:Math.min(1,p+1.96*se)};
  }

  /* 8) Гамма-Пуассон (NBD) для числа заказов: метод моментов r=m²/(v−m), α=m/(v−m).
        Предиктивное распределение на h дн: среднее r·h/α, P(нулевой день)=(α/(α+h))^r,
        P10/P90 из нормальной аппроксимации отрицательного биномиального. */
  function nbd(counts,h){
    const c=counts.slice(-180);
    const m2=mean(c),v2=std(c)**2;
    let r,alpha;
    if(v2>m2+1e-9){r=m2*m2/(v2-m2);alpha=m2/(v2-m2);}
    else{r=1e6;alpha=1e6/Math.max(1e-9,m2);}
    const mh=r*h/alpha;
    const p0=Math.pow(alpha/(alpha+h),r);
    const varh=mh*(1+mh/r);
    return {r,alpha,mean:mh,p0,p10:Math.max(0,Math.round(mh-1.2816*Math.sqrt(varh))),
            p90:Math.round(mh+1.2816*Math.sqrt(varh)),over:v2>m2+1e-9};
  }

  /* 9) CUPED: корректировка метрики ковариатой (тот же показатель неделю назад):
        θ=cov(y,x)/var(x), y*=y−θ(x−x̄). Возвращает скорректированный массив + % снижения дисперсии. */
  function cupedY(y,x){
    const mx=mean(x),my=mean(y);
    let cxy=0,vx=0;
    for(let i=0;i<y.length;i++){cxy+=(y[i]-my)*(x[i]-mx);vx+=(x[i]-mx)**2;}
    const th=vx>1e-12?cxy/vx:0;
    const adj=y.map((v,i)=>v-th*(x[i]-mx));
    const ma=mean(adj);
    const v0=sum(y.map(v=>(v-my)**2)),v1=sum(adj.map(v=>(v-ma)**2));
    return {adj,th,varRed:v0>0?Math.max(0,1-v1/v0):0};
  }

  /* scatter + линия регрессии.

  /* воронка (ширина ступени ∝ √значения — при CR 3% ступени остаются читаемы).

  function funnel(o){

    const w=o.w||360,rh=o.rh||22,gap=9;

      const labW=String(s.label).length*5.4+6;

      g+=sv('text',{x:inside?6:bw2+6,y:y+rh/2+3.2,'font-size':9,fill:inside?'#fff':'#3B4048','font-weight':600},esc2(label));
      g+=sv('text',{x:w-84,y:y+rh/2+3.5,'font-size':10,fill:'#14161A','font-weight':650,'font-family':'ui-monospace,monospace'},esc2(o.fmt?o.fmt(s.v):fmtN(s.v)));
      if(i>0){const cr=s.v/st[i-1].v;
        g+=sv('text',{x:w-84,y:y-gap/2+2.4,'font-size':7.2,fill:'#0B7A3E','font-family':'ui-monospace,monospace'},esc2('↓ '+(cr*100).toFixed(1).replace('.',',')+'% conv'));}});

    sh.forEach((v,i)=>{

      g+=sv('rect',{x,y:Y(v),width:bw2,height:h-pb-Y(v),rx:2,fill:o.color||'#1450A3',opacity:.82,'data-tip':escTip(tip)},'');
      g+=sv('text',{x:pl+i*bw+bw/2,y:h-6,'text-anchor':'middle','font-size':7.5,fill:'#5F646D'},esc2(labs[i]));});
    const cdf=z=>0.5*(1+erf2(z/Math.SQRT2));

    const mdl=labs.map((_,i)=>cdf((i+0.5-mu)/sd)-cdf((i-0.5-mu)/sd));

})();
/* ================= p09 · ВЫЧИСЛЕНИЯ (v2.2: пересборка при смене настроек) =================

function computeAll(){
  const P=DATA.products, dates=DATA.dates, store=DATA.store;

       v2.2: маржа II — ПОСЛЕ налога: для CFA-подхода налог есть обязательный элемент цены. --- */
  function unitEcon(p,price){
    price=price||p.price;
    const commission=price*p.comm;
    const lastMile=Math.max(14,price*0.055);
    const logistics=p.log;

    const ads=price*p.ads;
    const retCost=p.ret*(p.log*0.8+35);
    /* v2.5: фасовка и прочие расходы на штуку (мелочёвка) — теряются при возврате,
       поэтому фактор (1−ret), как у комиссии и последней мили */
    const pk=PACK.of(p),extras=pk.pack+pk.other;
    const marginPreTax=price*(1-p.ret)-p.cogs*(1-p.ret*0.85)-commission*(1-p.ret)-lastMile*(1-p.ret)
                 -logistics-p.ret*logistics*0.8-storage-ads-retCost-extras*(1-p.ret);
    const tax=TAXR.base==='выручка'? TAXR.rate*price*(1-p.ret) : TAXR.rate*Math.max(0,marginPreTax);
    const margin=marginPreTax-tax;

    /* упущенная выручка OOS: базовый спрос × маржа */
    const baseU=mean(s.units.slice(-180).filter((_,t)=>!s.oos[HIST_DAYS-180+t]));
    const lostRev90=oos90>0?baseU*oos90*90*p.price*ue[i].marginPct:0;
    /* доля промо-выручки за 180 дн */
    let pv=0;for(let t=HIST_DAYS-180;t<HIST_DAYS;t++)if(s.promo[t])pv+=s.rev[t];

    const az={abc:ST.abcAll()[p.id],...ST.xyzOf(p)};

       страховой запас SS = z·σ_день·√L (z=1,65 → SL 95%; L — срок поставки на склад Ozon);
       Заказ_h = max(0, Прогноз_h + SS − Остаток) — логика newsvendor [126,127,193,201]. */

  const skuCorrM=skuVars.map(a=>skuVars.map(b=>ST.spearman(a[1],b[1])));

  /* --- v2.2 · робастный тренд: Theil–Sen + бутстрап-CI медианы [118,119] --- */
  const rev365=rev.slice(-365);
  const tsRev=ST.theilSen(rev365);
  const tsSlopes=[];
  for(let b=0;b<160;b++){const s=new Array(365);for(let i=0;i<365;i++)s[i]=rev365[Math.floor(RND()*365)];tsSlopes.push(ST.theilSen(s).slope);}
  tsSlopes.sort((a,b)=>a-b);
  const tsCI=[quantile(tsSlopes,.025),quantile(tsSlopes,.975)];
  const bootMed=ST.bootCI(rev365,median,400);

  /* v2.8 · Каплан–Мейер «время до дефицита» + магазинная η как априор для усадки потоварных */
  const km=ST.kmStock(P);
  (function(){
    const Xl=[],yl=[];
    for(let t=N-365;t<N;t++){
      let r=0,u=0;P.forEach(p=>{r+=p.series.rev[t];u+=p.series.units[t];});
      const pi=u?r/u:0;
      if(pi>0){Xl.push([Math.log(pi)]);yl.push(Math.log(rev[t]));}
    }
    const elf=ST.olsFull(Xl,yl);
    prod.forEach(x=>{x.etaShr=ST.shrink(x.ela.ela,x.ela.se,elf.beta[1],elf.se[1]);});
  })();

  /* ================= v2.8 · RFM-сегменты + CLV (BG/NBD) =================
     База — синтетические аккаунты покупателей (согласованы с когортами). Единица времени — месяц.
     x = freq−1 (повторные покупки), t_x = lastK+1 (месяц последней покупки от первой),
     T = возраст аккаунта в месяцах. Горизонт CLV — t* = 3 мес (90 дней). */
  let rfm=null,mkv=null;
  (()=>{
    const custs=DATA.customers;
    /* BG/NBD в неделях: x — повторные покупки, t_x — неделя последней, T — возраст в неделях; t* = 13 нед (90 дн).
       recOf — месяцы (для RFM-свежести R). */
    const ageOf=c=>c.KW, txOf=c=>c.lastW, xOf=c=>c.freq-1, recOf=c=>(5-c.c)-c.lastK;
    /* RFM-скор 1-5 по ранговым квантилям: R — свежесть (меньше = лучше), F — частота, M — средний чек */
    const rank5=(vals,asc)=>{const idx=vals.map((v,i)=>i).sort((a,b)=>vals[a]-vals[b]);
      const sc=new Array(vals.length);
      idx.forEach((id,rank)=>{const s=Math.min(5,1+Math.floor(rank/vals.length*5));sc[id]=asc?s:6-s;});
      return sc;};
    const recArr=custs.map(recOf),frArr=custs.map(c=>c.freq),moArr=custs.map(c=>c.aov);
    const sR=rank5(recArr,false),sF=rank5(frArr,true),sM=rank5(moArr,true);
    const segName=(R,F)=>{
      if(R<=1)return 'Потерянные';
      if(R<=2)return 'В зоне риска';
      if(R===3)return 'Требуют внимания';
      if(R===4)return F>=4?'Лояльные':(F>=2?'Потенциально лояльные':'Есть потенциал');
      return F>=4?'Чемпионы':(F>=2?'Лояльные':'Новички');
    };
    /* BG/NBD: частотная таблица (x,tx,T) → MLE → P(alive), E[Y(3 мес)] по каждому аккаунту */
    const ftab=new Map();
    custs.forEach(c=>{const k=xOf(c)+'|'+txOf(c)+'|'+ageOf(c);ftab.set(k,(ftab.get(k)||{x:xOf(c),tx:txOf(c),T:ageOf(c),n:0}));ftab.get(k).n++;});
    const fit=ST.bgnbdFit([...ftab.values()]);
    const marginPerOrder=marginII30/Math.max(1,orders30);
    let aliveSum=0,eTxSum=0,clvSum=0,aliveN=0;
    const segAgg={};
    custs.forEach((c,i)=>{
      const bc=fit?ST.bgnbdCust(fit,xOf(c),txOf(c),ageOf(c),13):{pAlive:0,eTx:0};
      const clv=bc.eTx*marginPerOrder;
      const seg=segName(sR[i],sF[i]);
      aliveSum+=bc.pAlive;eTxSum+=bc.eTx;clvSum+=clv;if(bc.pAlive>=0.5)aliveN++;
      const g=segAgg[seg]||(segAgg[seg]={n:0,freq:0,spend:0,alive:0,clv:0,rfmM:0});
      g.n++;g.freq+=c.freq;g.spend+=c.aov*c.freq;g.alive+=bc.pAlive;g.clv+=clv;g.rfmM+=sM[i];
    });
    const SEG_ORDER=['Чемпионы','Лояльные','Потенциально лояльные','Есть потенциал','Новички','Требуют внимания','В зоне риска','Потерянные'];
    const segs=SEG_ORDER.filter(s=>segAgg[s]).map(s=>{const g=segAgg[s];return {name:s,n:g.n,share:g.n/custs.length,
      freq:g.freq/g.n,spend:g.spend/g.n,alive:g.alive/g.n,clv:g.clv/g.n,rfmM:g.rfmM/g.n};});
    rfm={fit,n:custs.length,aliveMean:custs.length?aliveSum/custs.length:0,aliveShare:custs.length?aliveN/custs.length:0,
      eTxMean:custs.length?eTxSum/custs.length:0,clvMean:custs.length?clvSum/custs.length:0,
      eTxTot:eTxSum,clvTot:clvSum,segs,marginPerOrder};
  })();

  /* ================= v2.8 · марковская цепочка воронки =================
     Состояния: показы → визиты → корзины → заказы, вероятность перехода = доля дошедших.
     Оценка по сумме дневных счётчиков (365 дн) + CI Джеффриса; устойчивость — по окнам 7/30/180 дн;
     проекция: 10 000 показов через цепочку переходов. */
  (()=>{
    const L=365,off=N-L,acc={imp:0,vis:0,cart:0,ord:0};
    for(let t=off;t<N;t++){acc.imp+=store.fun.imp[t];acc.vis+=store.fun.vis[t];acc.cart+=store.fun.cart[t];acc.ord+=store.fun.ord[t];}
    const win=(len)=>{const w={imp:0,vis:0,cart:0,ord:0};
      for(let t=N-Math.min(len,N);t<N;t++){w.imp+=store.fun.imp[t];w.vis+=store.fun.vis[t];w.cart+=store.fun.cart[t];w.ord+=store.fun.ord[t];}
      return [w.vis/Math.max(1,w.imp),w.cart/Math.max(1,w.vis),w.ord/Math.max(1,w.cart)];};
    const pImpVis=ST.bbinom(acc.vis,acc.imp),pVisCart=ST.bbinom(acc.cart,acc.vis),pCartOrd=ST.bbinom(acc.ord,acc.cart);
    const steps=[{name:'Показы → визиты',k:acc.vis,n:acc.imp,bb:pImpVis},
                 {name:'Визиты → корзины',k:acc.cart,n:acc.vis,bb:pVisCart},
                 {name:'Корзины → заказы',k:acc.ord,n:acc.cart,bb:pCartOrd}];
    const pChain=pImpVis.p*pVisCart.p*pCartOrd.p;
    const BASE_SHOWS=10000;
    const proj={shows:BASE_SHOWS,vis:BASE_SHOWS*pImpVis.p,cart:BASE_SHOWS*pImpVis.p*pVisCart.p,ord:BASE_SHOWS*pChain};
    const worstIdx=[pImpVis.p,pVisCart.p,pCartOrd.p].indexOf(Math.min(pImpVis.p,pVisCart.p,pCartOrd.p));
    const pp=[pImpVis.p,pVisCart.p,pCartOrd.p];
    const ppUp=pp.slice();ppUp[worstIdx]+=0.01;
    const projUp=BASE_SHOWS*ppUp[0]*ppUp[1]*ppUp[2];
    mkv={steps,proj,projUp,worstIdx,pChain,win7:win(7),win30:win(30),win180:win(180),ao:aov};
  })();

  return {unitEcon,ue,prod,rev30,revPrev,revDelta,units30,unitsPrev,orders30,ordersPrev,aov,ads30,drr30,
          ret90,dioStore,dso,dpo,ccc,cashGap,marginII,marginII30,hhi,gini,oos90,ready2buy,fbsBuyout,f7,fc,bt,dec,anom,
          fcSum,fcLo,fcHi,welchPromo,corrVars,corrM,mwRel,mwAll,repeatRate,riskDays,payoutTotal,fboW,invTotal,cogs90,priceIdx,
          taxR:TAXR,taxEst30,empCalc,fot30,fotPct,opexPerOrder,unitsPerOrder,multiShare,

          dm,lb,quant,f7bb,nbdStore,km,rfm,mkv};
}

    <div class="note">Роллинг-бэктест на тех же окнах, но фит «замораживается» на тренировке и прогнозирует 30 дн сразу — это консервативнее основного HW-бэктеста (10,8%), который обновляет состояние по ходу теста, поэтому цифры отличаются. v2.8: к 8 моделям добавлены SARIMA (0,1,1)(0,1,1) — «авиамодель» Бокса–Дженкинса, «Prophet-стиль» (тренд + годовые гармоники + будни + промо/события) и фильтр Калмана — всего 11. Комбо (среднее HW + SES + Тета + сезонной наивной) даёт <b>${fmtRubK(C.combFcSum)}</b> за 30 дн против ${fmtRubK(C.fcSum)} у Хольта-Уинтерса. Комбинация прогнозов устойчиво близка к лучшему участнику и реже проваливается: ошибки моделей слабо коррелированы [239,240]. Тета — победитель M4-соревнования по коротким сезонным рядам [241,242].</div>
    </div></details>`;
  /* чеки */
  const checksAll=DATA.orders.filter(o=>o.status!=='cancelled').map(o=>o.financial_data.price_total);
  /* боксплот по дням недели */
  const groups=WD.map((w,i)=>({label:w,vals:dates.map((d,t)=>wdIdx(d)===i?S.rev[t]:null).filter(v=>v!==null)}));
  const boxHtml=CH.box({groups,w:360,h:150,yFmt:v=>fmtK(v)});
  /* ACF */

  /* корреляции рядов магазина */

    tipFmt:(r,c,v)=>`${r} × ${c}: r=${v.toFixed(2).replace('.',',')}`,vFmt:v=>v.toFixed(2).replace('.',','),colorFn:(v,t)=>CH.heatColor(Math.abs(v),v<0)});
  /* v2.2 · межметричная корреляция SKU (Спирмен) */
  const skuCorrHtml=CH.heat({rows:C.skuVars.map(v=>v[0]),cols:C.skuVars.map(v=>v[0].slice(0,4)),matrix:C.skuCorrM,lh:86,cw:34,showVals:true,
    tipFmt:(r,c,v)=>`ρ Спирмена · ${r} × ${c} = ${v.toFixed(2).replace('.',',')}`,vFmt:v=>v.toFixed(2).replace('.',','),colorFn:(v,t)=>CH.heatColor(Math.abs(v),v<0)});
  /* месяц×день недели */
  const mwHtml=CH.heat({rows:MONTHS,cols:WD,matrix:C.mwRel,lh:26,cw:26,showVals:false,
    tipFmt:(r,c,v)=>`${r}, ${c}: ${Math.round(v*100)}% от среднего ≈ ${fmtRubK(v*C.mwAll)}/день`});
  /* Велч: промо vs база по отклонениям от сезонной базовой линии */
  const baseLine=dates.map((d,i)=>D.trend[i]+D.ann[i]+D.week[i]);
  const ratioP=[],ratioB=[],ratioP7=[],ratioB7=[];
  for(let t=HIST_DAYS-365;t<HIST_DAYS;t++){
    if(baseLine[t]<=0||t<7||baseLine[t-7]<=0)continue;

    (isP?ratioP:ratioB).push(r);
    (isP?ratioP7:ratioB7).push(r7);
  }
  const wp=ST.welch(ratioP,ratioB);
  const liftClean=wp.lift;
  /* v2.8 · CUPED: корректировка ковариатой «неделю назад» снижает дисперсию → точнее lift */
  const cupP=ST.cupedY(ratioP,ratioP7),cupB=ST.cupedY(ratioB,ratioB7);
  const wpC=ST.welch(cupP.adj,cupB.adj);
  const cupVarRed=mean([cupP.varRed,cupB.varRed]);
  const welchHtml=`<div class="mgrid" style="grid-template-columns:repeat(2,1fr)">
    <div class="mcell"><div class="l">Отклонение · дни промо</div><div class="v" style="color:${wp.ma>=0?'var(--up)':'var(--down)'}">${wp.ma>=0?'+':'−'}${Math.abs(wp.ma*100).toFixed(1).replace('.',',')}%</div><div class="n">к сезонной базовой линии</div></div>

    <div class="mcell"><div class="l">t = ${wp.t.toFixed(1)} · p ${wp.p<0.001?'&lt; 0,001':'= '+wp.p.toFixed(3).replace('.',',')}</div><div class="v">${ST.pStars(wp.p)||'n.s.'}</div><div class="n">тест Велча, асимптотика</div></div>
  </div>
  <div class="mgrid" style="grid-template-columns:repeat(2,1fr);margin-top:6px">
    <div class="mcell acc"><div class="l">Чистый эффект · CUPED</div><div class="v" style="color:${wpC.lift>=0?'var(--up)':'var(--down)'}">${wpC.lift>=0?'+':'−'}${Math.abs(wpC.lift*100).toFixed(0)}%</div><div class="n">ковариата «неделю назад» · θ=${cupP.th.toFixed(2).replace('.',',')}</div></div>
    <div class="mcell"><div class="l">p после CUPED</div><div class="v">${ST.pStars(wpC.p)||'n.s.'}</div><div class="n">дисперсия снижена на ${Math.max(0,cupVarRed*100).toFixed(0)}% — оценка точнее</div></div>
  </div>
    <div class="note">Эффект считается по отклонениям от базовой линии (тренд + годовые гармоники + день недели) — иначе lift смешивается с календарём [37–43]. CUPED использует вчерашний/недельный уровень как ковариату: то, что известно до решения, вычитается из шума [250]. Слабый эффект по выручке не противоречит эластичности: скидка 15–25% съедает большую часть прироста штук, промо выгодно только при запасе маржи и без каннибализации (пост-промо спад: <b>${(mean(C.prod.map(x=>x.dip))*100).toFixed(0)}%</b>).</div>`;
  const coh=DATA.cohorts;
  const cohHtml=CH.heat({rows:coh.labels,cols:['M0','M1','M2','M3','M4','M5'],matrix:coh.matrix.map((row,i)=>row.map(v=>v===null?null:v/coh.sizes[i])),lh:44,cw:34,showVals:true,vFmt:v=>(v*100).toFixed(0)+'%',tipFmt:(r,c,v)=>`${r}, ${c}: ${(v*100).toFixed(1).replace('.',',')}% когорты`});
  /* эластичность магазина: фит по наблюдаемому диапазону цен (с паддингом), круглые ценовые тики */
  const off=HIST_DAYS-365;const Xl=[],yl=[];
  for(let t=off;t<HIST_DAYS;t++){const pi=CALC.priceIdx[t-off];if(pi>0){Xl.push([Math.log(pi),CALC.corrVars[2][1][t-off]]);yl.push(Math.log(DATA.store.rev[t]));}}
  const elf=ST.olsFull(Xl.map(r=>[r[0]]),yl);

  const pxTickVals=[500,1000,2000,5000,10000,20000];
  const elaHtml=CH.scatter({pts,fit:{a:elf.beta[0],b:elf.beta[1]},w:360,h:160,xpad:0.03,

    note:`η = ${elf.beta[1].toFixed(2).replace('.',',')}${ST.pStars(elf.p[1])}`,xlabel:'средняя цена (лог-шкала)',ylabel:'выручка'});

    ${rows}</table></div>

    <div class="note">Итого по ${sorted.length} SKU: заказать <b class="num">${fmtN(tot.ship30)}</b> шт на 30 дн (${fmtN(tot.fc7)} шт на 7 дн, ${fmtN(tot.fc90)} шт на 90 дн) · деньги под заказ 30 дн ≈ <b class="num">${fmtRubK(money30)}</b> (закупка COGS + фасовка/прочее по каждому SKU). Срочных (DoC &lt; 10 дн): <b class="num">${urgent.length}</b>${urgent.length?' — '+esc(urgent.slice(0,3).map(x=>x.p.name.length>18?x.p.name.slice(0,17)+'…':x.p.name).join(', '))+(urgent.length>3?` и ещё ${urgent.length-3}`:''):''}.</div>
    <div class="note">Методика. Прогноз — Хольт-Уинтерс по штукам (m=7, фит на 365 дн). «Хватит, дн» (DoC) = остаток / прогнозная скорость; дата обнуления — в карточке товара. SS = z·σ_день·√L при выбранном уровне сервиса (кнопки выше, выбор сохраняется офлайн), L = 14 дн (FBO) / 7 дн (FBS). ROP = μ_L + SS — остаток, при котором пора возобновлять заказ. Класс — Syntetos–Boylan по ADI/CV² [133,134]: I/L — прерывистый спрос, для него скорость смотрите по Croston/SBA в карточке товара. Заказ_h = max(0, Прогноз_h + SS − Остаток). Если доверие к прогнозу низкое («Статистика» → «Качество прогноза») — заказывайте от нижней границы P10 (тоже в карточке товара). Клик по товару — полный расчёт и размерные кривые.</div>
  </div>`;
}
