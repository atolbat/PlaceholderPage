/* --- расширенные фильтры (персист) --- */
const PFILT={
  adv:LS.get('pfilters',{}),
  save(){LS.set('pfilters',this.adv);},
  active(){const a=this.adv;return ['marginMin','priceMax','gmroiMin','retMax','oosMax'].filter(k=>a[k]!==''&&a[k]!=null&&a[k]!==undefined).length+(STATE.pTags.length?1:0);},
  apply(list){
    const a=this.adv;
    if(a.marginMin!==''&&a.marginMin!=null)list=list.filter(x=>x.ue.marginPct*100>=+a.marginMin);
    if(a.priceMax!==''&&a.priceMax!=null)list=list.filter(x=>x.p.price<=+a.priceMax);
    if(a.gmroiMin!==''&&a.gmroiMin!=null)list=list.filter(x=>x.gmroi>=+a.gmroiMin);
    if(a.retMax!==''&&a.retMax!=null)list=list.filter(x=>x.retObs*100<=+a.retMax);
    if(a.oosMax!==''&&a.oosMax!=null)list=list.filter(x=>x.oos90*100<=+a.oosMax);
    if(STATE.pTags.length)list=list.filter(x=>{const tg=CALC.autoTags[x.p.id].concat(USER_TAGS.of(x.p.id));
      return STATE.pTags.every(t=>tg.indexOf(t)>=0);});
    return list;
  },
  reset(){this.adv={};this.save();STATE.pTags=[];LS.del('ptags');}
};
/* --- пользовательские теги товаров (персист) --- */
const USER_TAGS={
  map:LS.get('ptags',{}),
  of(pid){return this.map[pid]||[];},
  add(pid,t){t=t.trim().toLowerCase();if(!t)return;const arr=this.map[pid]||[];if(arr.indexOf(t)<0){arr.push(t);this.map[pid]=arr;LS.set('ptags',this.map);}},
  del(pid,t){const arr=this.map[pid]||[];this.map[pid]=arr.filter(v=>v!==t);LS.set('ptags',this.map);},
  all(){const s={};Object.keys(this.map).forEach(k=>{this.map[k].forEach(t=>{s[t]=(s[t]||0)+1;});});return s;}
};

/* --- v2.7 · взаимосвязи SKU: комплементы и каннибализация (ρ Спирмена рядов штук) --- */
function skuLinksCard(){
  const C=CALC;
  const rows=C.skuPairs.map(pr=>{
    const A=C.prod[pr.a],B=C.prod[pr.b];
    const same=A.p.cat===B.p.cat;
    const pos=pr.r>0;
    return `<div class="evrow"><div class="en">${esc(A.p.name)} × ${esc(B.p.name)}
      <div class="ed">${same?'одна категория':'разные категории'} · ${pos?'движутся вместе — общий трафик/комплементы':'зеркально — признак каннибализации/перелива'}</div></div>
      <span class="el ${pos?'up':'dn'}">ρ ${pr.r>=0?'+':'−'}${Math.abs(pr.r).toFixed(2).replace('.',',')}</span></div>`;
  }).join('')||'<div class="note">Значимых связей (|ρ| ≥ 0,32) не найдено.</div>';
  return `<div class="card" data-fid="pr_links" data-fsum="${C.skuPairs.length} значимых связей |ρ|≥0,32 · комплементы и каннибализация">
    <div class="card-h"><h3>Взаимосвязи SKU ${hb('skulinks')}</h3><span class="sub">ρ Спирмена рядов штук · 365 дн</span></div>
    ${rows}
    <div class="note">Положительная связь — товары растут и падают вместе (сезон, общая реклама, совместные покупки); отрицательная — спрос переливается с одного на другой (каннибализация ценой/промо, замена размера). Практика: пары с ρ &lt; −0,3 не дисконтировать одновременно — скидка уйдёт на перелив, а не на прирост; пары с ρ &gt; +0,3 выгодно двигать одной акцией и держать в сглаженном общем запасе. Спирмен устойчив к промо-выбросам [120].</div>
  </div>`;
}

  const base=[(a,b)=>b.rev30-a.rev30,(a,b)=>b.delta-a.delta,(a,b)=>b.gmroi-a.gmroi,(a,b)=>b.ue.marginPct-a.ue.marginPct,(a,b)=>b.retObs-a.retObs,(a,b)=>b.oos90-a.oos90];
  const dir=STATE.pAsc?-1:1;
  list.sort((a,b)=>dir*(base[STATE.pSort]||base[0])(a,b));

  const allTags=Object.keys(USER_TAGS.all());

  /* v2.3 · новая карточка товара: заголовок в 2 строки, лента метрик сеткой,

  const rows=list.map(x=>{
    const p=x.p;const tg=CALC.autoTags[p.id].map(t=>['auto',t]).concat(USER_TAGS.of(p.id).map(t=>['usr',t]));

    /* v2.5 · мини-статы под фото (пустое место слева): рейтинг+отзывы, заказы/24ч, Δостатка/24ч */

    const foot=[];
    if(PCARD.has('spark'))foot.push(`<span class="pspark">${CH.spark(x.spark,{w:84,h:16,color:p.color})}</span>`);
    if(PCARD.has('tags')&&tg.length)foot.push(tg.slice(0,2).map(t=>`<span class="tagchip ${t[0]==='auto'?'auto':'on'}">${esc(t[1])}</span>`).join('')+(tg.length>2?`<span class="tagchip auto">+${tg.length-2}</span>`:''));
    return `
    <button class="prow" data-open-prod="${p.id}">
      ${pcol}
      <span class="pbody">
        <span class="pline1"><span class="pname">${esc(p.name)}</span>${PCARD.has('delta')?dUp(x.delta):''}</span>
        <span class="pline2">${meta.join('<span style="opacity:.5">·</span>')}</span>
        ${st.length?`<span class="pstats">${st.map(s=>`<span class="pst"><b>${s[0]}</b><i>${s[1]}</i></span>`).join('')}</span>`:''}
        ${foot.length?`<span class="pline4">${foot.join('')}</span>`:''}

const CogsStore={
  map:LS.get('cogs',{}),
  for(p){const arr=this.map[p.sku];if(!arr)return null;return arr;},
  add(p,iso,cost,silent){
    const arr=(this.map[p.sku]||[]).slice();
    const h=p.cogsHist.map(h=>({iso:h.iso,c:h.c}));
    h.push({iso,c:Math.round(cost)});
    this.map[p.sku]=h;LS.set('cogs',this.map);
    applyCogsOverlay(p,{iso,c:Math.round(cost)});
    if(!silent)UI.toast('Себестоимость обновлена: <b>'+fmtRub(cost)+'</b> с '+esc(iso));
  },
  reset(){this.map={};LS.set('cogs',{});}
};
function applyCogsOverlay(){
  /* перегенерация истории из LS для всех товаров */
  DATA.products.forEach(p=>{
    const arr=CogsStore.map[p.sku];
    if(arr&&arr.length){
      p.cogsHist=arr.map(h=>{const t=DATA.dates.findIndex(d=>dISO(d)===h.iso);
        return {t:t<0?HIST_DAYS-1:t,iso:h.iso,c:h.c};}).sort((a,b)=>a.t-b.t);

      p.invValue=p.stock*p.cogs;

  });
}

/* ---------- v2.3 · размерные кривые: агрегация вариантов-«размеров» ---------- */
function sizeToken(label){return String(label).split('·')[0].trim();}
const SIZE_ORDER=['XXS','XS','S','M','L','XL','XXL','XXXL','3XL','4XL'];
function sizeKey(t){const i=SIZE_ORDER.indexOf(t);if(i>=0)return i;const n=parseFloat(t);return isNaN(n)?900:n;}
function buildSizeCurve(prods){
  const agg={};
  prods.forEach(p=>{if(String(p.cardGroup).indexOf('размер')<0)return;
    p.variants.forEach(v=>{if(v.kind!=='вариант')return;
      const t=sizeToken(v.label);if(!t)return;
      agg[t]=agg[t]||{s:0,u:0};agg[t].s+=v.share;agg[t].u+=v.units30;});});
  const keys=Object.keys(agg).sort((a,b)=>sizeKey(a)-sizeKey(b));
  if(keys.length<3)return null;
  const shares=keys.map(k=>agg[k].s);
  const sS=sum(shares)||1e-9;
  const mu=sum(shares.map((s,i)=>i*s))/sS;
  const sd=Math.sqrt(sum(shares.map((s,i)=>s*(i-mu)*(i-mu)))/sS)||0.8;
  return {labels:keys,shares,units:keys.map(k=>agg[k].u),mu,sd};
}
function sizeCurveBlock(sc,color,title){

/* ---------- v2.4 · потоварная статистика ряда: тренд, OLS, сезонность ----------
   Пользовательский запрос: «а тренд, OLS R² и прочее, и сезонность для товара?» —
   магазинная статистика смешивает SKU, поэтому вся декомпозиция повторяется на уровне карточки.
   Считается лениво при открытии модалки и кэшируется в x.ps (дешевле, чем гонять 14 SKU в computeAll).
   OOS-дни исключаются из регрессий и индексов; для декомпозиции/АКФ ряд заполняется линейной
   интерполяцией на OOS-интервалах — нули выбивают ложную «сезонность» и занижают R². */
function buildPS(p){
  const s=p.series,dates=DATA.dates,off=HIST_DAYS-365,N7=HIST_DAYS;
  const u365=s.units.slice(-365),d365=dates.slice(-365);
  const oosF=i=>s.oos[off+i];
  /* интерполяция OOS на ПОЛНОМ ряде (730 дн): на окне ровно в 1 год линейный тренд и
     годовая гармоника почти коллинеарны — декомпозиция перетаскивает сезонность в тренд
     (проверено: тренд худи «рос» 11→31 при падающем ряде). 730 дн якорят фазу года. */
  const fAll=s.units.slice();
  const oosA=t=>s.oos[t];
  for(let i=0;i<N7;i++){
    if(!oosA(i))continue;
    let a=i-1,b=i+1;
    while(a>=0&&oosA(a))a--;
    while(b<N7&&oosA(b))b++;
    fAll[i]=(a>=0&&b<N7)?s.units[a]+(s.units[b]-s.units[a])*(i-a)/(b-a):(a>=0?s.units[a]:(b<N7?s.units[b]:s.units[i]));
  }
  const uFill=fAll.slice(-365);/* последние 365 заполненных — для АКФ */
  /* Фурье-декомпозиция потоварно на 730 дн (как у магазина): тренд + годовая волна + неделя;
     мини-графики показывают последние 365 дн [9,16,100–102] */
  const dc=ST.decomp(fAll,dates);
  /* тренд — на СЕЗОННО СКОРРЕКТИРОВАННОМ ряде (минус год и неделя): окно 365 дн начинается
     и кончается в разных фазах сезона, и «сырой» Theil–Sen принимает спад от осеннего пика
     к летней яме за тренд (эффект проверен на худи). Остаётся: тренд + промо + события + шум.
     CI — остаточный блочный бутстрап: фиксируем fit, ресэмплим остатки блоками 30 дн
     (IID-ресэмплинг ряда запрещён — разрушает тренд, точка выпадает из своего CI) [118,119] */
  const sa=fAll.map((v,i)=>v-dc.ann[i]-dc.week[i]);
  const sa365=sa.slice(-365);
  const ts=ST.theilSen(sa365);
  const fitU=sa365.map((_,i)=>ts.intercept+ts.slope*i);
  const resU=sa365.map((v,i)=>v-fitU[i]);
  const BL=30,NB=Math.ceil(365/BL),sl=[];
  for(let b=0;b<60;b++){
    const e=[];
    for(let k=0;k<NB;k++){const st=Math.floor(RND()*365);
      for(let j=0;j<BL&&e.length<365;j++)e.push(resU[(st+j)%365]);}
    sl.push(ST.theilSen(fitU.map((v,i)=>v+e[i])).slope);
  }
  sl.sort((a,b)=>a-b);
  const tsCI=[quantile(sl,.025),quantile(sl,.975)];
  /* OLS уровня спроса на ПОЛНОМ ряде 730 дн: units ~ t + годовые гармоники + промо + дни недели
     (только дни в стоке). 730 дн обязательны: на окне в 1 год t и sin(2π·doy/365,25)
     коррелированы (∫t·sin ≠ 0) и наклон «сползает» — на двух циклах фаза года идентифицируется */
  const Xo=[],yo=[];
  for(let t=0;t<N7;t++){
    if(oosA(t))continue;
    const d=dates[t],w=wdIdx(d),doy=(d-dates[0])/DAY;
    const row=[t,Math.sin(2*Math.PI*doy/365.25),Math.cos(2*Math.PI*doy/365.25),Math.sin(4*Math.PI*doy/365.25),Math.cos(4*Math.PI*doy/365.25),s.promo[t]?1:0];
    for(let k=1;k<7;k++)row.push(w===k?1:0);
    Xo.push(row);yo.push(s.units[t]);
  }
  const olf=ST.olsFull(Xo,yo);
  /* недельные и месячные индексы по полному ряду (без OOS-дней), множитель к среднему SKU */
  const wA=new Array(7).fill(0),wC=new Array(7).fill(0),mA=new Array(12).fill(0),mC=new Array(12).fill(0);
  for(let t=0;t<N7;t++){
    if(oosA(t))continue;const d=dates[t],v=s.units[t],w=wdIdx(d);
    wA[w]+=v;wC[w]++;mA[d.getMonth()]+=v;mC[d.getMonth()]++;
  }
  const wM=wA.map((v,i)=>v/Math.max(1,wC[i])),wAll=mean(wM)||1;
  const wkRel=wM.map(v=>v/wAll);
  const mM=mA.map((v,i)=>v/Math.max(1,mC[i])),mAll=mean(mM)||1;
  const monRel=mM.map(v=>v/mAll);
  /* АКФ заполненного ряда: пики на 7/14/21 подтверждают недельную сезонность SKU */
  const ac=ST.acf(uFill.slice(-120),28);
  /* промо-lift по отклонениям от базовой линии товара (тренд+год+неделя), тест Велчу;
     базовая линия и отклонения — на полном ряде, последние 365 дн */
  const dOff=N7-365;
  const baseL=dc.trend.map((v,i)=>v+dc.ann[i]+dc.week[i]);
  const rp=[],rb=[];
  for(let t=dOff;t<N7;t++){
    if(oosA(t)||baseL[t]<=0)continue;
    (s.promo[t]?rp:rb).push(s.units[t]/baseL[t]-1);
  }
  const wp=ST.welch(rp,rb);
  /* чистый lift = разность отклонений; welch.lift (ma/mb−1) здесь не годится:
     отклонения от базовой линии центрированы вокруг нуля и mb < 0 обнуляет его */
  const plift=wp.ma-wp.mb;
  /* аномалии: дни с |остаток| > 2,5σ за последние 365 дн */
  const r365=dc.resid.slice(-365);
  const rMu=mean(r365),rSg=std(r365)||1;
  const anomN=r365.filter(r=>Math.abs((r-rMu)/rSg)>2.5).length;
  return {ts,tsCI,olf,dc,wkRel,monRel,ac,wp,plift,anomN,u365,uFill,d365,off,dOff};
}

/* ---------- детальная карточка товара (v2.3) ----------

  const T_cost=()=>put('cost','cost',true,()=>costSection(x),()=>bindCostSection(md,()=>openProduct(id)));

     каждое тяжёлое построение получает собственный кадр (rAF→setTimeout) */
  const tasks=[T_ela,T_fc,T_stock,T_funnel,T_ctx,T_ue,T_ret,T_ps,T_coh,T_var,T_diag,T_cost,T_tags,T_docs];
  const step=()=>{
    if(tok!==PP_TOK||$('#modal-root').hidden)return;/* закрыли/переоткрыли — очередь умирает */
    while(qi<tasks.length){
      let fast=false;
      try{fast=tasks[qi++]();}catch(e){}
      if(!fast)break;
    }
    if(qi<tasks.length)requestAnimationFrame(()=>setTimeout(step,0));
  };
  step();/* кэш-хиты сливаются мгновенно; первый же тяжёлый построение уходит в следующий кадр */
}

/* ---------- perf v2.9 · прогрев потоварной статистики в простое ----------
   buildPS (бутстрап Theil–Sen) — самая тяжёлая часть карточки товара. Прогреваем
   лениво по одному SKU за idle-кадр (сначала самые продающие), чтобы первое
   открытие карточки не ждало вычислений. Инвалидация автоматическая:
   refreshData() пересоздаёт CALC.prod → прогрев запускается заново. */
let WARMV=0;
function warmPS(){
  const v=++WARMV;
  const list=CALC.prod.slice().sort((a,b)=>b.rev30-a.rev30);
  let i=0;
  const schedule=window.requestIdleCallback?(fn)=>requestIdleCallback(fn,{timeout:600}):(fn)=>setTimeout(fn,80);
  const step=()=>{
    if(v!==WARMV)return;/* данные пересобраны — прогрев перезапущен */
    if(i>=list.length)return;
    const x=list[i++];
    if(!x.ps){try{x.ps=buildPS(x.p);}catch(e){}}
    schedule(step);
  };
  schedule(step);
}

/* ---------- v2.3 · документы: хранение в IndexedDB (метаданные + содержимое файлов) ----------
   IDB снимает лимит localStorage (~180 КБ): теперь хранятся файлы до 25 МБ, всё оффлайн.
   Стартовая загрузка/миграция старых правок — при инициализации (p13). */
const DOCS={
  db:[],
  ready:false,
  all(){return DATA.DOC_SEED.concat(this.db);},
  async add(owner,f,silent){
    const id='u'+Date.now()+Math.floor(Math.random()*999);
    const meta={id,owner,name:f.name||'документ',size:f.size||0,date:dISO(TODAY),note:''};
    try{
      if(typeof File!=='undefined'&&f instanceof File&&f.size<=25*1024*1024)
        meta.data=await readFileDataURL(f); /* крупные файлы — только метаданные */
    }catch(e){/* чтение не удалось — остаёмся на метаданных */}
    try{await IDB.put(meta);}catch(e){UI.toast('IndexedDB недоступна — документ не сохранён');return null;}
    this.db.push(meta);
    if(!silent)UI.toast('Документ прикреплён: <b>'+esc(meta.name)+'</b>');
    return meta;
  },
  async del(id){try{await IDB.del(id);}catch(e){}this.db=this.db.filter(d=>d.id!==id);},
  async migrate(){ /* перенос старых документов из localStorage в IDB */
    const old=LS.get('docs',[]),oldData=LS.get('docsData',{});
    if(!old.length)return;
    for(const m of old){const d=Object.assign({},m);if(oldData[m.id])d.data=oldData[m.id];
      try{await IDB.put(d);}catch(e){}}
    LS.del('docs');LS.del('docsData');
  },
  async load(){try{const arr=await IDB.all();if(arr&&arr.length)this.db=arr.filter(d=>d&&d.id);}catch(e){}this.ready=true;}
};
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+' МБ':b>=1024?Math.round(b/1024)+' КБ':b+' Б';}
function docRow(d){
  const href=d.data;
  const col=d.owner.t==='group'?'#5B3FA8':'#1450A3';
  return `<div class="docrow"><span class="di" style="background:${col}">${esc((d.name.split('.').pop()||'?').slice(0,4).toUpperCase())}</span>
    <span class="dn2">${esc(d.name)}${d.note?` <span class="ds">· ${esc(d.note)}</span>`:''}</span>
    <span class="ds">${fmtSize(d.size)} · ${esc(d.date)}</span>
    ${href?`<a class="tbtn" style="height:24px;padding:0 7px" href="${href}" download="${esc(d.name)}">⤓</a>`:''}
    ${String(d.id).charAt(0)==='u'?`<button class="tbtn" style="height:24px;padding:0 7px" data-doc-del="${d.id}">✕</button>`:''}</div>`;
}
function bindDocInputs(root,after){
  $$('[data-doc-add]',root).forEach(inp=>inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const [t,id]=inp.dataset.docAdd.split(':');
    const m=await DOCS.add({t,id:t==='group'?id:+id},f);
    if(m&&after)after();
  });
  $$('[data-doc-del]',root).forEach(b=>b.onclick=async()=>{await DOCS.del(b.dataset.docDel);if(after)after();});
}

/* ---------- v2.2 · группы товаров (семена + правки в LS) ---------- */
const Groups={
  list:null,
  all(){if(!this.list)this.list=LS.get('groups',null)||DATA.GROUP_SEED;return this.list;},
  save(){LS.set('groups',this.list);},
  stats(g){
    const ids=g.ids.slice();
    const prods=CALC.prod.filter(x=>ids.indexOf(x.p.id)>=0);
    const rev30=sum(prods.map(x=>x.rev30));
    const revW=sum(prods.map(x=>x.rev30));
    const marginPct=revW>0?sum(prods.map(x=>x.ue.marginPct*x.rev30))/revW:0;
    const gmroi=mean(prods.map(x=>x.gmroi));
    const oos=mean(prods.map(x=>x.oos90));
    const ret=mean(prods.map(x=>x.retObs));
    const dio=mean(prods.map(x=>x.dio));
    const spark=[];const L=60;
    for(let k=0;k<L;k++)spark.push(sum(prods.map(x=>x.p.series.rev[HIST_DAYS-L+k])));
    const units30=sum(prods.map(x=>x.sold30));
    /* ходовые варианты внутри группы (размерные кривые fashion) */
    const vars=[];prods.forEach(x=>x.p.variants.forEach(v=>vars.push({p:x.p,v})));
    vars.sort((a,b)=>b.v.units30-a.v.units30);
    return {ids,prods,rev30,marginPct,gmroi,oos,ret,dio,spark,units30,topVars:vars.slice(0,6)};
  },
  toggleSku(gid,pid){const g=this.all().find(v=>String(v.id)===String(gid));if(!g)return;
    const i=g.ids.indexOf(pid);if(i>=0)g.ids.splice(i,1);else g.ids.push(pid);this.save();}
};

/* --- модалка состава/создания группы --- */
function openGroupEdit(gid){
  const isNew=!gid;
  const g=isNew?{id:'g'+Date.now(),name:'Новая группа',ids:[],note:''}:Groups.all().find(v=>String(v.id)===String(gid));
  UI.openModal(`
  <div class="modal-bar"><h2>${isNew?'Новая группа':'Состав группы'} · ${esc(g.name)}</h2><button class="modal-x" onclick="UI.closeModal()"><svg width="11" height="11" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
  <div class="mbody"><div class="card">
    ${isNew?`<div class="field"><label>Название</label><input class="inp" id="g-name" placeholder="напр. Подарочный набор"></div>
    <div class="field"><label>Заметка</label><input class="inp" id="g-note" placeholder="что за пул"></div>`:''}
    <div style="font:600 9.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:4px 0 6px">SKU в группе</div>
    ${DATA.products.map(p=>`<label class="evrow" style="cursor:pointer">
      <span class="tagchip ${g.ids.indexOf(p.id)>=0?'sel':'auto'}">${g.ids.indexOf(p.id)>=0?'в группе':'—'}</span>
      <div class="en">${esc(p.name)}<div class="ed">${esc(p.offer_id)} · ${fmtRub(p.price)}</div></div>
      <input type="checkbox" ${g.ids.indexOf(p.id)>=0?'checked':''} data-gsku="${p.id}" style="width:16px;height:16px;accent-color:#1450A3"></label>`).join('')}
    <div class="mrow" style="margin-top:9px"><button class="tbtn" id="g-save" style="background:var(--ink);color:#fff">Сохранить</button></div>
  </div></div>`);
  $('#g-save').onclick=()=>{
    $$('#modal [data-gsku]').forEach(ch=>{const pid=+ch.dataset.gsku;
      const i=g.ids.indexOf(pid);
      if(ch.checked&&i<0)g.ids.push(pid);
      if(!ch.checked&&i>=0)g.ids.splice(i,1);});
    if(isNew){g.name=$('#g-name').value.trim()||'Группа';g.note=$('#g-note').value.trim();}
    const arr=Groups.all().slice();const i=arr.findIndex(v=>String(v.id)===String(g.id));
    if(i<0)arr.push(g);else arr[i]=g;
    Groups.list=arr;Groups.save();
    UI.closeModal();refreshData();UI.toast('Группа сохранена');
  };
}

const METRICS={
 rev:{t:'Выручка · 30 дней',def:'Сумма реализованных товаров (выкуп) за 30 дн по всем SKU. У Ozon — данные «Отчёта о реализации» (v3/finance/transaction/totals), а не заказы: между ними разница на выкуп и возвраты.',formula:'Σ (цена × qty) по выкупленным отправлениям',why:'Базовый числитель почти всех финансовых коэффициентов. Сравнивать надо с past period и с сезонно-скорректированной базой, иначе ноябрь всегда «выглядит гением».',refs:[1,2,87],val:fmtRubK(CALC.rev30)+' ('+(CALC.revDelta>=0?'+':'')+(CALC.revDelta*100).toFixed(1)+'% п/п)'},

 orders:{t:'Заказы · 30 дней',def:'Количество отправлений (posting_number). Один заказ может содержать несколько строк products[].',formula:'count(postings) за окно',why:'Вместе со средним чеком объясняет выручку: ΔRevenue ≈ ΔOrders×AOV + ΔAOV×Orders. Разлагайте рост на цену и трафик.',refs:[1,3],val:fmtN(CALC.orders30)+' шт'},
 aov:{t:'Средний чек (AOV)',def:'Выручка / число заказов. На маркетплейсах смещён долей дешёвых товаров первой цены.',formula:'AOV = Revenue / Orders',why:'Рычаг комплекта: рост AOV на 5% при прочих равных даёт марже больше, чем рост трафика на 5%, из-за фиксированных издержек на отправление.',refs:[1,4],val:fmtRub(CALC.aov)},
 drr:{t:'ДРР — доля рекламных расходов',def:'Расход на продвижение / выручка. Ozon даёт ДРР в рекламном кабинете, но не считает break-even порог по товару.',formula:'ДРР = Ads / Revenue; порог = Маржа II до рекламы / Цена',why:'Без порога рентабельности ДРР селлеры регулярно льют в минус: кампания «работает» по CPO, но съедает маржу. Безопасный режим — 0,8 × break-even.',refs:[19,20,91,92],val:fmtPct(CALC.drr30)+' · 30 дн'},
 gmroi:{t:'GMROI — отдача на запас',def:'Валовая маржа (годиз.) на 1 ₽, вложенный в запас по себестоимости. Ключевая метрика инвентарной продуктивности ритейла.',formula:'GMROI = (GM за период, годиз.) / Средний запас в себестоимости',why:'Соединяет маржинальность и оборачиваемость: товар с высокой наценкой, но замороженным складом проигрывает быстрому дешёвому. Норма ритейла ≥ 3×.',refs:[24,25,26,27,28],val:mean(CALC.prod.map(x=>x.gmroi)).toFixed(2)+'× · среднее по SKU'},
 ccc:{t:'Кассовый цикл (CCC)',def:'Дни от оплаты поставщику до получения денег от Ozon. У маркетплейса к выплате добавляется платформенный лаг (FBO T+16, FBS T+9 — демо-параметры).',formula:'CCC = DIO + DSO − DPO',why:'Главный убийца растущих селлеров: чем быстрее рост, тем больше нужно оборотки. CCC с лагом выплат длиннее, чем кажется по P&L.',refs:[31,32,33,34,35,36],val:Math.round(CALC.ccc)+' дн · разрыв '+fmtRubK(CALC.cashGap)},
 returns:{t:'Возвраты · 90 дней',def:'Доля возвращённых единиц от проданных. Факт, а не каталог: возвраты бьют по марже дважды — недополученная выручка + обратная логистика.',formula:'r = Returns / Sold',why:'В fashion онлайн-возвраты достигают 30%+; исследование fashion e-commerce показывает, что политика возвратов меняет прибыльность нелинейно [63].',refs:[63,64,65,66,67,68],val:fmtPct(CALC.ret90)},

 hhi:{t:'HHI — концентрация выручки по SKU',def:'Индекс Херфиндаля—Хиршмана по долям SKU в выручке: сумма квадратов долей в процентах.',formula:'HHI = Σ sᵢ², sᵢ в %',why:'Перенесён из антимонопольного анализа: HHI > 2500 — магазин зависит от 1–2 товаров, один OOS/блокировка ломает весь P&L.',refs:[1,69,74],val:Math.round(CALC.hhi)+' · Gini '+CALC.gini.toFixed(2).replace('.',',')},
 repeat:{t:'Repeat rate · 1 месяц',def:'Доля покупателей когорты, повторивших покупку в течение месяца. На маркетплейсе покупатель принадлежит платформе — считайте по своим отправлениям.',formula:'RR = повторившие / размер когорты',why:'LTV-прокси: удвоение RR снижает вдвое эффективный CAC. Ориентир e-commerce 20–30%, у маркетплейс-селлеров ниже [76].',refs:[75,76,77,78,79,80],val:fmtPct(CALC.repeatRate)},

 pcoh:{t:'Когорты покупателей SKU',what:'Удержание покупателей одного товара по месяцам первой покупки: доля когорты, повторившая покупку через M1…M5, плюс заказов на покупателя и доля повторных в заказах 30 дн.',why:'Магазинная когортная матрица усредняет расходники с fashion — и то, и другое врёт. Кофе возвращается через месяц, кроссовки — почти никогда; от профиля SKU зависит и закупка (M1-пик расходников), и стоимость привлечения (CAC окупается за сколько повторных покупок).',how:'Для расходников держите сток под M1-пик и используйте повторные покупки как бесплатный трафик; для электроники/fashion считайте покупателя разовым — LTV-планирование замените работой с чеком и расширением ассортимента. Метод: модель удержания профиля категории, т.к. Ozon не передаёт идентичность покупателя [76,226–229,231].'},

 bt:{t:'Качество прогноза',what:'Прогон модели по истории: «прошлые месяцы прогнозируем зная только прошлое» — и считаем промахи. WAPE — средний промах в %, Bias — систематический перелив/недолив со знаком, MASE — сравнение с тривиальным «повторить прошлую неделю».',why:'Заказ по плохому прогнозу — это OOS (потерянные продажи и позиция) или неликвид (замороженные деньги). Три цифры из этой карточки — единственное честное обоснование размера заказа.',how:'Куда что ставить: WAPE — размер подушки заказа, Bias — поправка со знаком (вычесть, если модель завышает), MASE — вердикт «пользоваться ли моделью вообще». WAPE до 10–15% — высокая точность; 15–30% — заказывайте с запасом; выше 30% — не верьте точке, берите нижнюю границу. MASE > 1 — модель хуже тривиальной, не используйте её [127,128,130,131]. Пошаговый расчёт заказа на живых цифрах — кнопка «Собрать заказ на моих цифрах» в этой карточке.'},

 pack:{t:'Фасовка и прочие расходы на единицу',what:'Переменные расходы на каждую проданную штуку сверх закупки: фасовка (пакет, бирка, плёнка, коробочка), маркировка «Честный знак», комплектация вложений, проверка комплектности.',why:'Для мелочёвки с низкой закупочной ценой фасовка съедает 3–8 п.п. маржи: закупка 150 ₽ + фасовка 12 ₽ — это −8% к прибыли на штуку, которую «не видно» в COGS. Без учёта юнит-экономика рисует прибыль, которой нет.',how:'Правится в «Истории себестоимости» карточки товара или в «Учёте» (колонка «Полная с/с»). Входит в маржу II, break-even ДРР и в деньги под заказ в планировщике пополнения: закупка партии = Σ Заказ × (COGS + фасовка + прочее).'},
 sizecurve:{t:'Размерная кривая',what:'Распределение продаж по размерам внутри карточки с подогнанной нормальной моделью (μ, σ) — линия поверх баров.',why:'Заказ «поровну» создаёт неликвиды в крайних размерах и OOS в ходовых; кривая задаёт структуру заказа и оценки замещения.',how:'Пополняйте размеры пропорционально долям кривой; крайние размеры — минимальными партиями. Пересматривайте при смене аудитории/сезона. В группах fashion — кривая по пулу [121,184,186,188].'},
 pstats:{t:'Статистика ряда товара',what:'Тренд (Theil–Sen на ряде без сезона, бутстрап-CI + OLS с гармониками для сравнения), R² регрессий, Фурье-декомпозиция (тренд/год/неделя), недельные и месячные индексы, АКФ, промо-lift по Велчу и аномалии — всё по одному SKU.',why:'Магазинная статистика смешивает 14 SKU: рост магазина может прятать падение отдельного товара, а «сезонность магазина» — не совпадать с сезонностью карточки.',how:'Если CI наклона содержит нуль — устойчивого тренда нет, планируйте от сезонной базы SKU. Пики АКФ на 7/14/21 подтверждают недельный период; месячные индексы — календарь поставок и промо под этот товар; пик недели — день пополнения и ставки рекламы.'},
 robust:{t:'Theil–Sen и бутстрап',what:'Робастная оценка тренда (медиана попарных наклонов) + бутстрап-CI.',why:'OLS-тренд завышается промо-пиками 11.11/НГ; Theil–Sen устойчив к выбросам.',how:'Если Theil–Sen ≈ 0, а OLS > 0 — «рост» сделан 2–3 пиками; не закладывайте его в план [118,119].'},
 welch:{t:'Тест Велча: промо',what:'Сравнение отклонений от сезонной базовой линии в промо-дни и обычные.',why:'Честный lift с поправкой на календарь, а не «в лоб» сравнение дней.',how:'Смотрите вместе с пост-промо спадом: lift без учёта каннибализации завышает выгоду акции.'},
 checkdist:{t:'Распределение чека',what:'Гистограмма + KDE чеков с переключателем линейная/лог-шкала и кастомным диапазоном.',why:'Дешёвые товары дают пик слева, дорогие — длинный хвост: на линейной шкале хвост «съедает» картинку.',how:'В лог-режиме моды читаются раздельно; диапазон сужайте на категорию. Настройки сохраняются офлайн.'},
 dowbox:{t:'Боксплот по дням недели',what:'Медиана, IQR и усы 1,5·IQR выручки по дням недели.',why:'Планирование смен, поставок и ставок рекламы под пик Пт–Вс.',how:'Выбросы над усами — промо-дни; сравнивайте медиану, а не среднее.'},
 acf:{t:'Автокорреляция (ACF)',what:'Корреляция ряда с собственными лагами (1–28).',why:'Пики на лагах 7/14/21 обосновывают недельную сезонность HW (m=7).',how:'Если ACF(7) слабая — сезонность внутри недели отсутствует, HW упрощается.'},
 corrm:{t:'Корреляционная матрица',what:'Пирсон между дневными рядами метрик (цена, промо, OOS, ДРР…).',why:'Быстрый поиск связанных метрик до построения регрессий.',how:'Корреляция ≠ каузальность [120]; сильную пару проверяйте на лагах и в карточке товара.'},
 storeela:{t:'Эластичность магазина',what:'log-log регрессия выручки по средней цене с контролем промо.',why:'Показывает чувствительность спроса к цене на уровне портфеля.',how:'Фит и ось построены по наблюдаемым ценам (не от нуля). Используйте для оценки эффекта индексации [57–62].'},
 monthwd:{t:'Месяц × день недели',what:'Тепловая карта относительной выручки (% от среднего).',why:'Видно «январскую яму», декабрьский пик и недельный ритм каждого месяца.',how:'Наведите курсор или коснитесь клетки — там абсолютная оценка ₽/день. Используйте для фазы закупок.'},
 skucorr:{t:'Корреляции метрик SKU',what:'ρ Спирмена между 9 метриками по 14 SKU.',why:'Ищет парадоксы портфеля: где высокая маржа идёт с низким GMROI и т.п.',how:'n=14 — сигнальный уровень; подтверждайте решения потоварным анализом.'},
 cohorts:{t:'Когорты',what:'Удержание покупателей по месяцам после первой покупки. Магазинная матрица — взвешенное среднее потоварных когорт (согласованность уровней); для отдельного товара — в его карточке.',why:'Честный LTV: видно, возвращается ли клиент к продавцу.',how:'Если M1 < 10% — вкладывайтесь в качество/контент, а не в привлечение. Потоварные когорты: карточка товара → «Когорты покупателей».'},
 wf2:{t:'Разложение маржи II',what:'Waterfall: цена → COGS → комиссия → логистика → миля → хранение → реклама → возвраты → налог → маржа.',why:'Показывает, где именно утекает маржа по каждому SKU.',how:'Выбирайте товар селектором; строка «Налог» зависит от режима в «Учёте». Break-even ДРР — порог рекламы.'},
 ccc:{t:'Кассовый цикл',what:'CCC = DIO + DSO(лаг выплат Ozon) − DPO.',why:'Рост на маркетплейсе требует оборотки: чем длиннее CCC, тем больше разрыв.',how:'Сокращение CCC на 5 дней высвобождает деньги: считайте в карточке ниже [31–36].'},
 payouts:{t:'График выплат',what:'Ближайшие даты перечислений FBO/FBS от Ozon.',why:'Синхронизация оплат поставщикам с поступлениями платформы.',how:'Таблица скроллится по горизонтали на узком экране; суммы — демо-график [31–36].'},
 gmroi2:{t:'GMROI × DIO',what:'Пузырьковая карта: отдача на запас vs оборачиваемость; размер = выручка.',why:'Соединяет маржу и скорость: главный компас инвентарной политики [24–30].',how:'Право-верх — масштабируйте; лево-верх — урежьте сток; низ — пересмотрите цену/закупку.'},
 bedrr:{t:'Break-even ДРР',what:'Порог ДРР, выше которого реклама съедает маржу II (после налога).',why:'Защита от «успешных» кампаний в минус.',how:'Красные бары — ДРР выше порога: режьте ставки или меняйте карточку. Безопасный режим 0,8×BE.'},
 ooslost:{t:'Упущенная маржа OOS',what:'Оценка маржи, потерянной в дни дефицита (спрос по базовой линии).',why:'Продажи в OOS = 0, но спрос не нулевой: naive-отчёты занижают потери [50–56].',how:'Топ-10 — в таблице, полный список — по кнопке. Лечится страховочным запасом по XYZ.'},
 risks:{t:'Риски и комплаенс',what:'Индекс цены (дни риска штрафа), HHI/Gini концентрации, выкуп FBS.',why:'Хвостовые риски: штрафы платформы и зависимость от 1–2 SKU.',how:'HHI>2500 — диверсифицируйте портфель; days риска — выравнивайте цены с индексом.'},
 opex:{t:'ФОТ и налоги',what:'Расходы на людей (штат+ГПХ) и налог за 30 дн, доля от выручки и стоимость на заказ.',why:'Постоянные расходы определяют точку безубыточности магазина, а не товара.',how:'Настраивайте сотрудников и режим налога во вкладке «Учёт»; всё пересчитается автоматически.'},
 groups:{t:'Группы товаров',what:'Пулы SKU (новинки, ликвидация, fashion) со сводной статистикой и размерными кривыми.',why:'Позволяют смотреть на пул как на один товар: маржа, GMROI, ходовые варианты.',how:'Состав, создание и статистика — во вкладке «Товары»; документы можно вешать на группу.'},
 retr:{t:'Причины возвратов',what:'Структура возвратов по причинам (демо-распределение категории).',why:'Размер/описание/брак лечатся по-разному: контентом, сеткой, поставщиком [63–68].',how:'«Не подошёл размер» — добавьте размерную таблицу и замеры; «брак» — к поставщику.'},
 diag:{t:'Диагностика и действия',what:'Автоправила на порогах: запас, OOS, ДРР vs BE, промо-спад, XYZ.',why:'Превращает метрики в конкретные действия.',how:'Список пересчитывается при каждом изменении данных и настроек.'},
 variants:{t:'Варианты и состав карточки',what:'Статистика по размерам/цветам/комплектациям внутри карточки Ozon.',why:'Одна карточка = много товаров: без разбивки не узнать ходовой размер [121].',how:'Заказывайте размеры пропорционально долям; «другой товар» в карточке считайте отдельно.'},
 cogs:{t:'История себестоимости',what:'Хронология закупочных цен SKU с ручными правками и батч-импортом CSV.',why:'COGS не константа: курс и сырьё меняют маржу; GMROI по датам честнее.',how:'Добавляйте точку (дата+цена) или загрузите CSV (sku;cogs;date). Всё сохраняется офлайн.'},
 rev:{t:'Выручка · 30 дней',what:'Реализованная выручка (выкуп) по SKU за 30 дн.',why:'База всех относительных метрик карточки.',how:'Сравнивайте с дельтой к пред. 30 дн и с сезонной базой, иначе 11.11 льстит.'},
 margin:{t:'Маржа II (после налога)',what:'Вклад на штуку: цена минус COGS, комиссия, логистика, миля, хранение, реклама, возвраты и налог.',why:'Единственная честная маржа для решений по цене и рекламе [17–23].',how:'Если маржа II < 10% — любой ДРР выше 3–4% опасен; см. break-even.'},
 fcst:{t:'Потоварный прогноз',what:'Хольт-Уинтерс по штукам с 95% CI на 30 дн.',why:'База для заказа и оценки OOS-риска SKU.',how:'CI нижней границы — консервативный заказ; верхней — ёмкость склада.'},
 ela:{t:'Эластичность η',what:'%Δ спроса на 1%Δ цены, log-log OLS с контролем промо.',why:'Превращает смену цены из рулетки в расчёт [57–62].',how:'Фит по наблюдаемым ценам. η=−2: снижение цены 5% даёт ≈+10% штук; проверяйте против маржи.'},
 taxreg:{t:'Налоговый режим',what:'НПД 4%, УСН 6%, УСН 15% (Д−Р), ОСНО 20% — влияет на маржу II всего магазина.',why:'Налог — обязательный элемент юнит-экономики; без него маржа льстит.',how:'Переключите режим — все waterfall, BE ДРР и KPI пересчитаются. НДС и минимальный налог 1% в демо не моделируются [122].'},
 hr:{t:'Сотрудники и ФОТ',what:'Штат и ГПХ с моделями: оклад, сдельная, % выручки, дневная, за проект, оклад+%.',why:'ФОТ — постоянная часть расходов; cost per order показывает порог юнит-экономики магазина [125].',how:'График смен влияет на расчёт дневной модели; всё хранится офлайн и пересчитывает ФОТ-блоки.'},
 docs:{t:'Документы',what:'Прикрепление файлов к товарам и группам; хранение — в IndexedDB браузера (оффлайн).',why:'Сертификаты, брифы и сетки под рукой; документы группы — общий контекст пула.',how:'Файлы до 25 МБ сохраняются целиком и скачиваются обратно кнопкой ⤓; крупнее — только метаданные. Удаление доступно для своих файлов. Старые вложения из localStorage переносятся в IndexedDB автоматически.'},
 tour:{t:'Турнир моделей прогноза',what:'8 моделей (наивная, сезонная наивная, дрейф, SES, Хольт, Тета, Хольт-Уинтерс, комбо) на одном роллинг-бэктесте; чемпион — минимальный WAPE.',why:'Нет «лучшей модели вообще»: на коротких сезонных рядах побеждает то HW, то Тета, то комбо. Турнир честно показывает, кто лучше на ваших данных, а комбо страхует от неудачи одного класса моделей [239,240,241].',how:'Если чемпион — наивная/сезонная, не усложняйте: HW не оправдался. Комбо-сумму сравнивайте с HW-суммой — расхождение > 5% — признак нестабильного ряда.'},
 quant:{t:'Квантильный прогноз P10/P90',what:'Границы прогноза из эмпирических остатков: P10 — консервативный сценарий, P90 — верхний.',why:'CI — про случайность модели, квантили — про решения: закупка от P10 не разорит склад при худшем сценарии, ёмкость под P90 не захлебнётся в пике [247].',how:'Базовая закупка — от точки; агрессивная (промо, рост) — от P90; осторожная (низкое доверие, лизинг денег) — от P10.'},
 cusum:{t:'CUSUM: сдвиги уровня',what:'Кумулятивная сумма нормированных отклонений с допуском k=0,5σ и порогом h=5σ.',why:'Разовые выбросы видны по |z|>2,5σ, а устойчивое изменение уровня (слом сезонности, слив карточки, рост спроса) ловит только CUSUM [248,249].',how:'Сдвиг вверх — нарастите страховой запас и ставки до пересчёта сезонных моделей; сдвиг вниз — проверьте цену/позицию/OOS, не ждите конца месяца.'},
 sboylan:{t:'Классификация спроса SBC',what:'Двумерная классификация Syntetos–Boylan: ADI (средний интервал между продажами) × CV² (нестабильность размеров партий).',why:'Пороги 1,32 и 0,49 отделяют гладкий спрос от прерывистого: для I/L классов среднее — врущая метрика, нужен Croston [133,134].',how:'S/E — обычные методы; I/L — Croston/SBA, крупные партии и ручной контроль; страховой запас для E/Z — крупнее.'},
 croston:{t:'Croston и SBA',what:'Метод Кростона: отдельные SES на размере партии и интервале между продажами; SBA — поправка ×(1−α/2), устраняющая систематическое завышение.',why:'Для прерывистого спроса (ADI>1,32) HW/среднее систематически ошибаются; Croston — стандарт 50 лет [14,243,244].',how:'Используйте SBA-скорость для заказа I/L-классов (класс — в «Пополнении», колонка «Класс»). При α=0,2 завышение Croston ≈ 10%.'},
 sl:{t:'Уровень сервиса SS',what:'Вероятность не попасть в OOS за срок поставки; задаёт z в SS = z·σ·√L (90%→1,28, 95%→1,65, 98%→2,05, 99%→2,33).',why:'SL — экономическое решение, а не константа: чем выше маржа SKU, тем дороже OOS и тем выше должен быть SL [193,194,198].',how:'Выбор сохраняется офлайн и пересчитывает SS/ROP/заказы. Для маржинальных расходников — 98–99%, для низкомаржинального хвоста — 90%.'},
 eoq:{t:'EOQ: экономичная партия',what:'Q* = √(2AD/H): баланс стоимости обработки закупки (A=300 ₽/заказ) и хранения (H = 25%/год полной с/с штуки).',why:'Заказать «раз в год большими партиями» — заморозить деньги в хранении; «каждую неделю мелочью» — утонуть в обработке. EOQ даёт компромисс [248].',how:'Заказывайте кратно EOQ с округлением до упаковки поставщика; при скидках за объём сравнивайте EOQ с порогом скидки.'},
 nv:{t:'Newsvendor: Q*',what:'Объем по критическому соотношению: CR = Cu/(Cu+Co), где Cu — недополученная маржа (недопродажа), Co — потери неликвида (пересорт); Q* = μ_L + z_CR·σ_L.',why:'Модель «продавца газет» — академический стандарт разовой закупки при неопределённом спросе [193,201].',how:'При CR 75% и нормальном спросе Q* ≈ средний спрос + 0,67σ за срок поставки. Q* < заказа по SS — склад застрахован чрезмерно.'},
 lerner:{t:'Цена оптимума: Лернер',what:'p* = MC·ε/(1+ε) — наценка на предельные издержки, обратно пропорциональная эластичности.',why:'Правило Лернера соединяет ваши две оценки — η (из данных) и MC (из учёта) — в конкретную цену [246].',how:'Проверяйте η на значимость (***). Сдвигайтесь к p* шагами по 3–5% с замером продаж; при ±30%+ постоянная эластичность ломается.'},
 retp:{t:'Проекция удержания',what:'Степенной закон r_k = a·k^(−b), отфильтрованный по наблюдаемым M1–M5, с проекцией M6–M12 и ожидаемыми заказами на покупателя за 12 мес.',why:'Когортная матрица обрывается на M5, а LTV-решения (CAC, промо на подписку) живут на горизонте года [245].',how:'R² < 80% — кривая нестабильна, не экстраполируйте. LTV-прокси = заказы_12м × маржа II/шт; сравнивайте с CAC SKU.'},
 skulinks:{t:'Взаимосвязи SKU',what:'ρ Спирмена между дневными рядами штук пар товаров (365 дн): +ρ — движутся вместе, −ρ — перелив спроса.',why:'Каннибализация и комплементы не видны в потоварных карточках: там каждый товар «сам по себе».',how:'Пары с ρ < −0,3 не дисконтируйте одновременно; пары с ρ > +0,3 — в одну акцию и общий страховой запас. При n=14 — сигнальный уровень [120].'},
 rfmclv:{t:'RFM и CLV (BG/NBD)',what:'RFM — оценка каждого покупателя по свежести (R), частоте (F) и сумме (M) покупок, 1–5 балла каждая; сегменты — от «Чемпионов» до «Потерянных». BG/NBD — вероятностная модель повторных покупок: P(alive) — жив ли покупатель, E[Y(t*)] — сколько заказов от него ждать.',why:'Деньги рекламы делятся по-разному: вернуть «живого» покупателя в 3–5 раз дешевле привлечь нового, а «Потерянных» часто бесполезно стимулировать. CLV показывает потолок цены привлечения: если CLV 90д = 240 ₽ маржи, скидка на привлечение выше этого — минус.',how:'Смотрите таблицу сегментов: сначала работайте с «В зоне риска» (ещё можно спасти напоминанием) и «Новичками» (дешевле всего поднять вторую покупку), «Чемпионов» не трогайте скидками — им важны новинки и ранний доступ. База — аккаунты «товар × покупатель», согласована с когортной матрицей [226,227,229,230,249].'},
 mkvfun:{t:'Марковская воронка',what:'Воронка как цепочка вероятностей переходов: показ→визит→корзина→заказ, каждая ступень оценена по дневным счётчикам за год с байесовским интервалом (Джеффрис).',why:'Показывает не только «где теряем» (узкое звено), но и сколько это стоит: из-за мультипликативности цепочки +1 п.п. к самой тугой ступени даёт больше заказов, чем тот же пункт к любой другой.',how:'Строка «из 10 000 показов» — базовый сценарий для планирования ДРР: при текущих переходах 10 000 показов превращаются в N заказов. Сравните окна 7/30/180 дн: сильный разброс — воронка дрейфует (сезон/акции/OOS), сначала почините дрейф, потом лейте трафик. Узкое звено подсвечено; контент/цена чинят «визиты→корзины», сток и касса — «корзины→заказы» [228].'},
 ctx:{t:'Место в магазине и категории',what:'Контекст SKU в портфеле: ранги по выручке/марже/GMROI, кумулятивная доля Парето, бенчмарки против медианы своей категории (цена, маржа, оборачиваемость), стадия жизненного цикла по тренду штук, сезонная позиция (месячные индексы), промо-профиль и сильнейшая ρ-связь с другим SKU.',why:'Изолированная метрика товара обманчива: маржа 5% может быть худшей в категории, «падение» — сезонной ямой, а «спад» по тренду — поводом остановить закупку до конца сезона. Ранг и кумулятив отвечают «сколько этот SKU весит в магазине» и где кончается топ-80% (граница A/B).',how:'На «спаде» ЖЦ — режьте закупку/рекламу; на «росте» — наращивайте SS; в низкой сезон заказывайте от P10. Цену сверяйте с медианой категории, а не магазина. ρ-связи — кандидаты на комплект/сопутку (или сигнал каннибализации внутри категории) [69–74,24–29,251,252,120].'}
};

const NICHE=[
 {n:'Пост-промо спад (post-promotion dip)',ev:'A',refs:[37,38,39,42,43],def:'Систематическое падение продаж ниже базовой линии в 3–7 дней после окончания промо: покупатели «запаслись» вперёд (stockpiling).',formula:'Dip = mean(Q[t+1..t+4]) / mean(Q[t−7..t]) − 1',i:'Классика промо-литературы: спад подтверждён на панельных данных FMCG и в newsvendor-моделях. Планируйте запас и рекламу с учётом «ямы» после акции — иначе сдвинете её на убыточные недели.'},
 {n:'Зависимость от промо (promo dependency)',ev:'B',refs:[37,41],def:'Доля выручки, полученной в промо-окнах. Выше ~40% — маржа и позиция в поиске живут от акции к акции.',formula:'PDR = Revenue_promo / Revenue_total',i:'Высокий PDR тренирует покупателя ждать скидку и обнуляет полноразмерную цену. Лечится расширением длинного хвоста и работой с рейтингом/контентом.'},
 {n:'GMROI по SKU',ev:'A',refs:[24,25,26,27,28,29],def:'Сколько валовой маржи приносит 1 ₽, замороженный в запасе, в годовом выражении.',formula:'GMROI = GM_год / AvgInventory_atCost',i:'Стандарт мерч-аналитики ритейла, но в кабинетах маркетплейсов отсутствует. Считается по товару, а не по магазину: разброс между SKU достигает 10×.'},
 {n:'CCC с лагом выплат маркетплейса',ev:'A',refs:[31,32,33,34,35,36],def:'Кассовый цикл, где DSO = платформенный лаг перечисления средств, а не срок оплаты покупателем.',formula:'CCC = DIO + DSO_platform − DPO',i:'Финансовый стандарт (CFA), адаптированный под marketplace: деньги Ozon перечисляет с задержкой, что удлиняет цикл и раздувает потребность в оборотном капитале при росте.'},
 {n:'Истинная маржа после возвратов',ev:'A',refs:[63,64,65,66,67,68],def:'Маржа, пересчитанная на фактический возврат: недополученная выручка, обратная логистика, обработка, потеря товарного вида.',formula:'P·(1−r) − COGS·(1−0,85r) − L·(1+0,8r) − …',i:'14% возвратов в e-commerce — мошеннические либо «арендные» (в fashion до 35% намеренных). Оценка маржи без возвратов систематически завышает прибыль.'},
 {n:'Процент выкупа (FBS)',ev:'B',refs:[94,95,96,97,98,99],def:'Доля заказов, доведённых до выкупа. Проваливается на примерке одежды/обуви.',formula:'Buyout = Выкуплено / Заказано',i:'Нормы по категориям различаются: >85% — отлично, <70% в fashion — обычное дело. Низкий выкуп = двойная логистика и замороженные отправления.'},
 {n:'Потери от OOS (упущенная маржа)',ev:'A',refs:[50,51,52,53,54,55],def:'Оценка спроса в дни дефицита через базовую линию (продажи не равны спросу — часть спроса пропадает).',formula:'LostMargin = BaselineDemand × OOSдни × Маржа',i:'Данные о продажах цензурированы нулем в OOS: naive-анализ занижает спрос. Оценка через прогнозную базу — стандарт в литературе о lost sales.'},
 {n:'Потоварная эластичность η',ev:'A',refs:[57,58,59,60,61,62],def:'%Δ спроса на 1%Δ цены. Оценивается на собственных дневных данных, с контролем промо.',formula:'ln(Q) = β₀ + η·ln(P) + γ·Promo + ε',i:'Онлайн-эластичность в среднем ниже офлайновой (−0,87 vs −1,74 по структурным оценкам). Знание η превращает смену цены из рулетки в расчёт.'},
 {n:'Коэффициент готовности к покупке',ev:'C',refs:[87,88],def:'Ozon-метрика: доля показов с доступным к заказу товаром.',formula:'Ready% = доступные показы / все показы',i:'Полу-документированная метрика платформы: зависит от остатков, сроков поставки и корректности цены. Дешёвый способ поднять конверсию без рекламы.'},
 {n:'Скорость отзывов и моментум рейтинга',ev:'A',refs:[44,45,46,47,48,49],def:'Отзывов на 100 заказов и динамика рейтинга. Объём и валентность отзывов — устойчивые предикторы продаж (мета-анализ 26 исследований, 443 эффекта).',formula:'RV = Отзывы / Заказы × 100',i:'Мета-анализ Floyd et al.: эффект объёма отзывов сопоставим с брендом. На маркетплейсе карточка с «мёртвыми» отзывами проигрывает рекламные бюджеты.'},
 {n:'Доля поисковых показов (share of voice)',ev:'B',refs:[81,82,83,86],def:'Показы карточки / показы ниши. Прокси видимости во внутренней поисковой выдаче.',formula:'SoV = Impressions_SKU / Impressions_category',i:'Ранжирование внутренней поисковой системы — главный бесплатный источник трафика; факторы: конверсия, OOS, рейтинг, цена к индексной.'},
 {n:'Концентрация SKU: HHI и Джини',ev:'B',refs:[1,69,74],def:'Насколько выручка магазина завязана на топ-товары.',formula:'HHI = Σsᵢ²; Gini из кривой Лоренца',i:'HHI>2500 — риск: блокировка одного SKU обрушивает магазин. Джини > 0,6 — «одноногий» ассортимент; план роста хвоста снижает волатильность.'},
 {n:'CV спроса → страховой запас (XYZ)',ev:'A',refs:[69,70,71,72,73,74],def:'Коэффициент вариации дневных продаж определяет класс стабильности и размер страхового запаса.',formula:'SS = z × σ_d × √L (z≈1,65 при SL 95%)',i:'XYZ-классификация — стандарт supply chain: X (CV<0,45) прогнозируем, Z — нет. Страховой запас считается отдельно по каждому классу, а не «на глаз».'},
 {n:'Weeks of cover vs sell-through',ev:'B',refs:[24,26,29,30],def:'На сколько недель хватит остатка при текущей скорости продаж.',formula:'WoC = Stock / (Sold/7)',i:'Баланс: <2 нед — риск OOS, >8 нед — заморозка капитала и платное хранение. Оптимум зависит от маржи: чем выше GMROI, тем выгоднее держать больше.'},
 {n:'Repeat rate по когортам',ev:'A',refs:[75,76,77,78,79,80],def:'Удержание покупателей когорты по месяцам после первой покупки.',formula:'RR_m = N(m) / N(0)',i:'Когортная кривая — честный LTV без «средней температуры»: помогает понять, возвращается ли покупатель к продавцу или уходит в выдачу платформы.'},
 {n:'Halo-эффект и длинный хвост',ev:'B',refs:[1,5,6],def:'Топ-SKU генерирует трафик на весь магазин; хвост товаров ловит кросс-продажи и снижает HHI.',formula:'Share топ-3 SKU; Gini',i:'Стратегия «магнит + хвост»: витринный товар с минимальной маржей покупает трафик, хвост конвертирует. Контролируйте долю топ-3 в выручке.'},
 {n:'Размерная кривая (size curve) по вариантам карточки',ev:'B',refs:[121,184,185,186,188],def:'Распределение продаж по размерам/цветам/комплектациям внутри одной карточки Ozon с подгонкой нормальной модели (μ, σ); в карточке могут быть и вообще разные товары.',formula:'Share_v = Units_v / Σ Units; заказ_v = Заказ × Share_v; wᵢ = Φ((i+0,5−μ)/σ) − Φ((i−0,5−μ)/σ)',i:'Без разбивки по вариантам невозможно узнать ходовой размер: заказ «поровну» создаёт неликвиды в крайних размерах и OOS в ходовых. Нормальная модель поверх факта показывает, где кривая «косая» (α-асимметрия аудитории) — сигнал пересобрать сетку. Стандарт fashion-планирования Zara/Inditex [188].'},
 {n:'Стоимость заказа (ФОТ-единица, cost per order)',ev:'B',refs:[125],def:'Прямые расходы на людей (штат + ГПХ) плюс налог, делённые на число отправлений за период.',formula:'CPO = (ФОТ + Налог) / Отправления',i:'Селлеры считают комиссию и логистику, но забывают собственный труд и смены сборщиков: без ФОТ-единицы точка безубыточности магазина систематически занижена.'},
 {n:'Себестоимость как временной ряд (COGS history)',ev:'A',refs:[31,32],def:'Закупочная цена SKU с датами изменений; маржа и GMROI считаются по датам, а не по сегодняшней цене.',formula:'GMROI = GM(по cogs(t)) / AvgInv',i:'В РФ-реальности COGS плывёт с курсом и сырьём: расчёт по «сегодняшней» закупке переоценивает прошлую маржу и искажает решения по выводу SKU.'},
 {n:'Планирование пополнения: DoC и страховой запас',ev:'A',refs:[126,127,134,193,194,198,201],def:'На сколько дней хватит остатка (DoC) при прогнозной скорости и сколько штук заказать под горизонт h с учётом страхового запаса.',formula:'DoC = I₀ / FC_daily;  Заказ_h = max(0, Σ_{i≤h} FCᵢ + z·σ_d·√L − I₀)',i:'Формализует решение «сколько заливать на склад Ozon» — против двух типовых ошибок заказчика: pull-to-center (заказ «на глазок» к среднему) и игнорирования срока поставки. Уровень сервиса 95% соответствует z = 1,65; при низком доверии к прогнозу критическая фракция сдвигается к нижней границе CI [198,201].'},
 {n:'Доверие к прогнозу как рабочая метрика',ev:'A',refs:[127,128,130,131,135],def:'Вердикт о применимости точечного прогноза: WAPE задаёт буфер заказа, Bias — поправку со знаком, MASE — сравнение с наивной моделью.',formula:'Буфер_h ≈ WAPE × ΣFC_h;  Коррекция_h = Bias × h;  Доверие: WAPE<12% ∧ MASE<0,8 → высокая',i:'Превращает бэктест из «цифр для отчёта» в правила закупки: сколько не угадываем (буфер), куда систематически врём (смещение) и стоит ли модель того (MASE). Пороги розницы: WAPE 10–15% — высокий, >30% — заказ от нижней границы CI.'},
 {n:'Потоварная воронка: показ → выкуп',ev:'B',refs:[226,227,228,229,230],def:'Полный конверсионный путь одного SKU: CTR поиска (показ→визит), конверсия карточки (визит→корзина), касса (корзина→заказ) и выкуп; каждая ступень сравнивается с медианой магазина.',formula:'CR_total = CTR × CVС × CCO × Buyout;  Диагностика: ступень с min(CR_i / CR_i^median)',i:'Воронко-анализ e-commerce показывает: потери распределены неравномерно, и «средний» CR маскирует узкие ступени. Продуктовая воронка отделяет проблемы трафика (позиция, CTR) от проблем карточки (контент, цена) и логистики (OOS давит конверсию; выкуп — fashion-специфика).'},
 {n:'Классификация спроса Syntetos–Boylan (ADI × CV²)',ev:'B',refs:[133,134],def:'Разделение SKU на гладкий (S), рваный (E), прерывистый (I) и комковатый (L) спрос по среднему интервалу между продажами и квадрату CV размеров партий.',formula:'ADI = n / N_ненулевых;  CV² = (σ_размеров/μ_размеров)²;  пороги: ADI 1,32 и CV² 0,49',i:'Классификация фиксирует ошибку «среднего»: для прерывистого спроса средняя скорость — фикция, и заказ по ней гарантированно ошибается. Стандарт интервального прогнозирования спроса с 2005 года.'},
 {n:'Цена оптимума: правило Лернера',ev:'B',refs:[246],def:'Оптимальная наценка при постоянной эластичности спроса: отношение маржи к цене равно обратной эластичности.',formula:'p* = MC·ε/(1+ε);  (p*−MC)/p* = −1/ε',i:'Мост между вашей η (из дневных данных) и MC (из учёта): конкретная цена вместо «попробуем −5%». Чем менее эластичен товар (η→0), тем выше допустимая наценка — поэтому расходники с η≈−1 держат маржу, а fashion с η≈−2 живёт на обороте.'},
 {n:'Проекция удержания: степенной закон',ev:'B',refs:[245],def:'Экстраполяция обрывающейся когортной кривой по степени r_k = a·k^(−b) с оценкой ожидаемых заказов на покупателя на горизонт 12 мес.',formula:'ln r_k = a − b·ln k (OLS по наблюдаемым M1–M5);  E[заказы₁₂] = 1 + Σr_k',i:'Когорты «созревают» годами — ждать нельзя, а решения по CAC нужны сейчас. Степенная аппроксимация удержания — стандартная практика в подписных моделях; на маркетплейсе работает как LTV-прокси до умножения на маржу.'},
 {n:'Взаимосвязи SKU: каннибализация и комплементы',ev:'B',refs:[120],def:'Ранговая корреляция дневных рядов штук пар товаров: положительная — общий фактор (сезон/реклама), отрицательная — перелив спроса.',formula:'ρ = corr(rank(Qᵢ), rank(Qⱼ));  значимость |ρ| > 2/√n',i:'Потоварная аналитика молчит о взаимодействиях: скидка на товар может «съесть» соседнюю позицию, а не поднять продажи. Отрицательные пары — кандидаты на раздельные промо-окна и замену в размерных сетках.'},
 {n:'RFM-сегментация и CLV по BG/NBD',ev:'A',refs:[226,227,229,230,249],def:'Каждый покупатель оценивается по свежести (R), частоте (F) и сумме (M); сегменты от «Чемпионов» до «Потерянных». BG/NBD добавляет P(alive) и ожидаемые заказы на горизонт: CLV = E[Y(t*)] × маржа заказа.',formula:'pAlive = 1/(1+δ·(a/(b+x−1))·((α+T)/(α+t_x))^(r+x));  CLV₉₀ = E[Y(3)] × маржа/заказ',i:'Стандарт «считать клиентов просто» (Fader–Hardie): вероятность «живости» считается в замкнутой форме, параметры оцениваются MLE по частотной таблице (x, t_x, T) — у нас по синтетической базе, согласованной с когортами. Практика: промо на возврат — только сегментам с высоким P(alive); CLV — потолок CAC.'},
 {n:'Место SKU в магазине и категории (портфельный контекст)',ev:'B',refs:[1,69,74],def:'Ранги и доли SKU по выручке/марже/GMROI, кумулятивная доля Парето («сколько дают товары вплоть до этого») и бенчмарки против медианы своей категории: цена, маржа II, оборачиваемость.',formula:'Share = Rev_SKU / Rev_магазин;  Cum% = Σ_rev(до SKU включительно)/Rev;  Δcat = X_SKU − median(X_категория)',i:'ABC — грубая проекция этого же контекста: ранг и кумулятив дают непрерывную картину вместо трёх букв. Бенчмарки против категории, а не магазина: сравнение кроссовок с кофе бесполезно — в категории видны и ценовая позиция (дороже/дешевле медианы), и относительная эффективность запаса.'},
 {n:'Стадия жизненного цикла SKU по тренду',ev:'B',refs:[251,252],def:'Классификация «рост / зрелость / спад» по наклону ряда штук за 365 дн (OLS, OOS-дни исключены) и его значимости; порог ±15%/год к среднему уровню SKU.',formula:'relY = β₁·365/μ·100%;  стадия = рост (relY≥+15%, p<0,05) · спад (relY≤−15%, p<0,05) · зрелость (иначе)',i:'Формализация правил Левитта/Дэя: стадия определяет менеджерский режим — на росте наращивают страховой запас и рекламу, на зрелости борются за оборот и долю, на спаде сокращают закупку и не льют ДРР в умирающую позицию. Без значимости тренда «спад» — всего лишь сезонная яма, а не диагноз.'}

 {n:'Синтетические когорты SKU: согласование с магазином',refs:[76,77,78,79,80,226,231,232],

 {n:'Турнир моделей и комбинированный прогноз',refs:[239,240,241,242],
  f:'Комбо_h = mean(FC_HW; FC_SES; FC_Тета; FC_SNaive);  Чемпион = argmin WAPE на роллинг-окнах',
  d:'8 моделей на одном роллинг-бэктесте (3 окна × 30 дн): наивная, сезонная наивная, дрейф, SES, Хольт, Тета, Хольт-Уинтерс, комбинация. Тета — SES-прогноз тета-линии (θ=2: 2·Y минус OLS-тренд), полусумма с линейной экстраполяцией — победитель M4 по коротким сезонным рядам. Простое среднее прогнозов (Бейтс–Гренджер) редко сильно уступает чемпиону и почти не проваливается: ошибки моделей слабо коррелированы. Подбор параметров каждой модели — сеткой по SSE на тренировочном окне, без утечки теста.'},
 {n:'Квантильный прогноз спроса',refs:[247],

 {n:'CUSUM: контрольная карта сдвига уровня',refs:[243,244],

  d:'Кумулятивные суммы нормированных отклонений (остатки декомпозиции) с допуском k=0,5σ и порогом h=5σ — чувствительность ≈ сдвиг 1σ за ~10 дней. Видит то, что пропускают правила |z|>2,5σ: медленный дрейф уровня после поломки карточки, смены цены или сезонного сдвига. EWMA (Roberts, 1959) — альтернатива с памятью через λ.'},
 {n:'Croston и SBA: прерывистый спрос',refs:[132,133,134],

  d:'Метод Кростона разделяет ряд на «когда продаёт» (интервалы) и «сколько продаёт» (размеры) — по SES на каждом. Классика завышает скорость на ≈α/2, поправка Синтетоса–Бойлана (SBA) это устраняет; применимость — по классификации ADI×CV² (пороги 1,32 / 0,49). В панели класс demand показан в «Пополнении», скорость Croston/SBA — в карточке SKU.'},
 {n:'Инвентарные модели: ROP, EOQ, Newsvendor',refs:[193,194,198,201,248],
  f:'ROP = μ_L + z_SL·σ_d·√L;  EOQ = √(2AD/H);  Q* = μ_L + z_{CR}·σ_L, CR = Cu/(Cu+Co)',
  d:'Три классических правила на одном прогнозе: ROP — «когда» (остаток, при котором возобновлять заказ), EOQ — «как много за раз» (баланс обработки A=300 ₽ и хранения 25%/год с/с), newsvendor — «сколько в разовую закупку» (критическое соотношение недопродажи и неликвида, z_CR из обратного нормального распределения). SL выбирается селектором 90–99% и хранится офлайн. Ограничение: нормальное приближение спроса на горизонте L; для I/L-классов σ занижена — используйте Croston/SBA и ручной контроль.'},
 {n:'Оптимум цены: правило Лернера',refs:[246],

 {n:'Проекция удержания и LTV-прокси',refs:[245,226,231,232],

  d:'Наблюдаемая часть когортной кривой (M1–M5 из-за треугольника наблюдаемости) фитится степенным законом в log-log; хвост M6–M12 — экстраполяция. R² фита показывается как качество экстраполяции: ниже 80% — не использовать для денег. Ограничение: демо-когорты модельные (профиль категории), на реальных данных фитите по своим повторным отправлениям.'},
 {n:'SARIMA (0,1,1)(0,1,1)ₘ — «авиамодель»',refs:[126,127,128,129],
  f:'wₜ = (1−B)(1−Bᵐ)Yₜ;  wₜ = (1−θB)(1−ΘBᵐ)εₜ;  ŷ_{T+s} = y_{T+s−m} + θ·e_{s−1} + Θ·e_{s−m} + θΘ·e_{s−m−1}',
  d:'Классика Бокса–Дженкинса для дневных рядов ритейла: сезонная разность снимает недельную сезонность, первая — тренд; МА-параметры θ (день) и Θ (неделя) подбираются сеткой по SSE на остатках. Рекурсивный прогноз на h шагов. В турнире — участник №9: консервативен на стабильных рядах, выигрывает на «шумных» с чёткой недельной структурой.'},
 {n:'«Prophet-стиль»: тренд + годовые гармоники + календарь',refs:[126,136],

  d:'Динамическая гармоническая регрессия в духе Prophet/Тейлора: OLS по всему ряду (тренд с демпфированием на горизонте, 3 годовые гармоники, дни недели, индикаторы промо и событий РФ), прогноз — экстраполяция компонент. Участник №10: прозрачные компоненты вместо «чёрного ящика»; чувствителен к смене режима — тогда выигрывают адаптивные модели.'},
 {n:'Фильтр Калмана: локальный уровень',refs:[126,129],
  f:'αₜ = αₜ₋₁ + ηₜ (сигнал);  yₜ = αₜ + εₜ (наблюдение);  Kₜ = Pₚ/(Pₚ+σ²);  α̂ₜ = α̂ₚ + Kₜ(yₜ − α̂ₚ)',
  d:'Локальный уровень в форме фильтра Калмана: оптимальная (минимум MSE) рекурсия при случайном блуждании сигнала с шумом наблюдения. Отношение шумов q подбирается сеткой по SSE; прогноз = последний отфильтрованный уровень. Участник №11: мгновенно реагирует на сдвиги уровня (полезно после OOS-эпизодов), но шумнее HW на ровных рядах.'},
 {n:'BG/NBD: ожидаемые покупки и P(alive)',refs:[226,227,229,230],
  f:'L = Γ(r+x)/Γ(r)·(α/(α+T))^r·[B(a,b+x)/B(a,b)·(α+T)^{−(r+x)} + δ·(a/(b+x−1))·(α+t_x)^{−(r+x)}];  E[Y(t*)] — замкнутая форма с ₂F₁',
  d:'Покупатель активен с пуассоновской интенсивностью λ ~ Gamma(r,α); после каждой покупки с вероятностью p ~ Beta(a,b) «уходит» (не возвращается). Параметры (r,α,a,b) оцениваются максимизацией правдоподобия на частотной таблице (x, t_x, T) — сеткой в лог-пространстве с уточнением. Ожидаемое число покупок за t* — замкнутая формула с гипергеометрической функцией ₂F₁ (ряд). CLV = E[Y(t*)] × маржу заказа.'},
 {n:'CUPED: ковариата для снижения дисперсии',refs:[250],
  f:'θ = cov(y,x)/var(x);  y* = y − θ·(x − x̄);  Var(y*)/Var(y) = 1 − ρ²',
  d:'Метод экспериментальной практики (Денг и соавт., Microsoft): корректировка метрики пред-экспериментальной ковариатой — у нас отклонение выручки неделю назад. Дисперсия падает пропорционально ρ², поэтому то же A/B-сравнение (промо vs база) требует меньше дней для той же значимости. На панели: lift после CUPED совпадает по знаку с «сырым», но CI уже.'},
 {n:'Диагностика прогноза: Льюнг–Бокс, Диболд–Мариано, калибровка',refs:[127,129,131,239,240,247],

  d:'Три честных вопроса к модели. Льюнг–Бокс: остались ли в остатках закономерности (H₀ «белый шум» — если отвергается, модель недоучла структуру и интервалам верить нельзя). Диболд–Мариано: значимо ли чемпион турнира точнее тривиального бенчмарка (сравнение квадратов ошибок с HAC-дисперсией по Ньюи–Уэсту). Калибровка: эмпирическое покрытие CI80 против номинального 80% + pinball-лосс τ = 0,1/0,5/0,9 (конвенции квантильных прогнозов M5 [238]).'},
 {n:'Байесовские конверсии: Beta-Binomial и Gamma-Poisson',refs:[227,231],
  f:'p̂ = (k+0,5)/(n+1) (априор Джеффриса);  NBD: λ ~ Gamma(r,α), заказы_h ~ Poisson(λ·h), E = r·h/α',
  d:'Конверсия ступени — не точка, а распределение: априор Джеффриса (β(½,½)) даёт честные интервалы при малых счётчиках и нулях. Для числа заказов — гамма-пуассоновская смесь (NBD): метод моментов по дневным счётчикам, предиктив на горизонт с P(нуля) и P10/P90 из отрицательного биномиального. Применяется в воронках и бэктестах карточки товара.'},

 {n:'Контекст SKU: ранги, категорийные бенчмарки, ЖЦ, сезон',refs:[1,69,74,251,252,100,120],
  f:'Share = Rev_SKU/Rev;  Cum% = Σ(до SKU)/Rev;  Δcat = X_SKU − median_cat;  relY = β₁·365/μ·100% (OLS 365 дн без OOS, порог ±15% при p<0,05);  Iₘ = μ_шт(месяц m)/μ_шт;  глубина промо = 1 − P_promo/P_base',

/* ---------- UI (v2.2: подсказки «?», кастомные селекторы, тултипы, вкладка «Учёт») ---------- */
const UI=(function(){
  const rendered={overview:true};
  function showTab(name){
    $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
    $$('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+name));
    if(!rendered[name]){rendered[name]=true;
      if(name==='stats')renderStats();
      if(name==='products')renderProducts();
      if(name==='finance')renderFinance();
      if(name==='account')renderAccount();
      if(name==='method')renderMethod();
    }
    try{FOLD.scan();}catch(e){}
    try{window.scrollTo({top:0,behavior:'auto'});}catch(e){}
  }
  function openModal(html){
    $('#modal').innerHTML=html;$('#modal-root').hidden=false;document.body.style.overflow='hidden';
    try{FOLD.scan($('#modal'));}catch(e){}
  }
  function closeModal(){$('#modal-root').hidden=true;$('#modal').innerHTML='';document.body.style.overflow='';hideHint();}

  /* ---------- v2.9 · «Прогноз → заказ»: WAPE/Bias/MASE человеческим языком + живой калькулятор.
     Все числа берутся из CALC на момент открытия: бэктест (WAPE/Bias/MASE), HW-прогноз
     с 95% CI, доверие fcTrust(). Горизонты 7/30/90 дн и три стратегии заказа пересчитываются
     на лету (UI.ohCtl) — пользователь видит, откуда берётся каждая строка заказа. ---------- */
  const OH={h:30,strat:'buf'};
  function ohData(){
    const C=CALC,bt=C.bt,h=OH.h;
    /* WAPE измерен на 30-дневных окнах: короткие горизонты промахиваются чаще (√-правило) */
    const wapeH=Math.min(0.9,bt.wape*Math.sqrt(30/h));
    const sl=a=>a.slice(0,h).reduce((s,v)=>s+v,0);
    let base,lo,hi,rough=false;
    if(h<=30){base=sl(C.fc.fc);lo=sl(C.fc.lo95);hi=sl(C.fc.hi95);}
    else{base=C.fcSum*(h/30);lo=C.fcLo*(h/30);hi=C.fcHi*(h/30);rough=true;/* 90 дн = 3×30, сезонность квартала не выделена */}
    const corr=bt.bias*h;/* систематическое смещение, накопленное за горизонт */
    const err=wapeH*base;
    let res,label;
    if(OH.strat==='point'){res=base+(Math.abs(corr)<base*0.01?0:corr);label='в точку, с поправкой на Bias';}
    else if(OH.strat==='buf'){res=base+corr+err;label='с подушкой 1×WAPE (дефицит дороже склада)';}
    else{res=lo;label='от нижней границы 95% CI (склад и деньги дороже дефицита)';}
    return {C,bt,h,wapeH,base,lo,hi,corr,err,res:Math.max(0,res),rough,label};
  }
  function ohOut(){
    const d=ohData();
    const rr=v=>fmtRubK(Math.max(0,v));
    const wS=v=>(v*100).toFixed(1).replace('.',',');
    const corrTxt=Math.abs(d.corr)<d.base*0.01
      ?'не требуется ('+(d.bt.bias>=0?'+':'−')+fmtK(Math.abs(d.bt.bias))+'/дн — меньше 1% плана)'
      :(d.corr>0?'− '+rr(d.corr)+' (модель завышает)':'+ '+rr(-d.corr)+' (модель занижает)');
    const sq=(Math.sqrt(30/d.h)).toFixed(2).replace('.',',');
    return `<div class="ohline"><span class="ol">Прогноз выручки, ${d.h} дн${d.rough?' <span class="ds">(грубо: 3 × прогноз 30 дн — сезонность внутри квартала не выделена)</span>':''}</span><span class="ov">${rr(d.base)}</span></div>
    <div class="ohline"><span class="ol">Поправка на Bias — систематическое враньё модели, копится каждый день</span><span class="ov">${corrTxt}</span></div>
    ${OH.strat==='lo'
      ?`<div class="ohline"><span class="ol">Вместо точки — нижняя граница 95% CI: подушка уже «встроена» в интервал</span><span class="ov">${rr(d.lo)}</span></div>`
      :`<div class="ohline"><span class="ol">Подушка на средний промах · WAPE ${wS(d.wapeH)}% для ${d.h} дн (30-дневный ${wS(d.bt.wape)}% × √(30/${d.h}) ≈ ${sq})</span><span class="ov">+ ${rr(d.err)}</span></div>`}
    <div class="ohline total"><span class="ol">Объём заказа, который это даёт — ${d.label}</span><span class="ov">${rr(d.res)}</span></div>
    <div class="ohline"><span class="ol">Весь разброс 95% CI — оптимист/пессимист</span><span class="ov">${rr(d.lo)} — ${rr(d.hi)}</span></div>`;
  }
  function ohBox(){
    const H=(v,l,s)=>`<button type="button" class="ohb ${OH.h===v?'on':''}" onclick="UI.ohCtl(${v},null)">${l}<small>${s}</small></button>`;
    const S=(k,l,s)=>`<button type="button" class="ohb ${OH.strat===k?'on':''}" onclick="UI.ohCtl(null,'${k}')">${l}<small>${s}</small></button>`;
    return `<div class="ohrow">${H(7,'7 дней','недельная поставка FBS')}${H(30,'30 дней','месячный цикл FBO')}${H(90,'90 дней','стратегический горизонт')}</div>
    <div class="ohrow">${S('point','В точку','склад и деньги дороже дефицита')}${S('buf','С подушкой','дефицит дороже: OOS роняет позицию')}${S('lo','От нижней границы','мало доверия к цифрам')}</div>
    <div style="margin-top:8px">${ohOut()}</div>`;
  }
  function ohCtl(h,s){
    if(h)OH.h=h;
    if(s)OH.strat=s;
    const box=$('#oh-box');
    if(box)box.innerHTML=ohBox();
  }
  function openOrderHow(){
    const C=CALC,bt=C.bt;
    const trust=fcTrust();
    const errRub=bt.wape*C.fcSum;
    const corrRub=bt.bias*FCST_DAYS;
    const wapeS=(bt.wape*100).toFixed(1).replace('.',',');
    const maseS=bt.mase.toFixed(2).replace('.',',');
    const biasS=(bt.bias>=0?'+':'−')+fmtK(Math.abs(bt.bias));
    openModal(`
    <div class="modal-bar"><h2>Прогноз → заказ: WAPE, Bias, MASE — на ваших цифрах</h2><button class="modal-x" onclick="UI.closeModal()"><svg width="11" height="11" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
    <div class="mbody">
      <div class="mgrid" style="grid-template-columns:repeat(2,1fr)">
        <div class="mcell acc"><div class="l">WAPE · средний промах</div><div class="v">${wapeS}%</div><div class="n">бэктест · ${bt.win} окна × 30 дн</div></div>
        <div class="mcell"><div class="l">Bias · смещение со знаком</div><div class="v">${biasS}/дн</div><div class="n">${Math.abs(corrRub)<C.fcSum*0.01?'смещение пренебрежимо мало':(bt.bias>0?'модель завышает спрос':'модель занижает спрос')}</div></div>
        <div class="mcell ${bt.mase<1?'acc-g':'acc-r'}"><div class="l">MASE · против «повторить неделю»</div><div class="v">${maseS}</div><div class="n">${bt.mase<1?'модель умнее тривиальной':'модель хуже тривиальной'}</div></div>

const API_BASE='https://api-seller.ozon.ru';
const API={
  async save(){
    const cid=$('#api-cid').value.trim(),key=$('#api-key').value.trim();

  },

    const saved=JSON.parse(localStorage.getItem('ozon_keys')||'{}');
    const cid=$('#api-cid')?$('#api-cid').value.trim():saved.cid,key=$('#api-key')?$('#api-key').value.trim():saved.key;
    if(!cid||!key){UI.toast('Сначала заполните ключи');return;}

    try{
      const r=await fetch(API_BASE+'/v3/product/list',{method:'POST',
        headers:{'Content-Type':'application/json','Client-Id':cid,'Api-Key':key},
        body:JSON.stringify({filter:{visibility:'ALL'},last_id:'',limit:10})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const n=(j.result&&j.result.items&&j.result.items.length)||0;
      const chip=$('#mode-chip');chip.classList.add('live');chip.innerHTML='<span class="dot"></span>LIVE · '+n+' SKU';
      UI.toast('API отвечает: получено SKU — <b>'+n+'</b>. Полная замена демо-данных выполняется слоем маппинга (см. Методологию).');
    }catch(e){
      UI.toast('<b>CORS/сеть: '+esc(e.message)+'</b><br>Браузер не может напрямую обращаться к API Ozon. Разверните прокси (серверная функция) и укажите её в константе API_BASE. Демо-данные продолжают работать.');
    }
  }
};

/* ---------- v2.2 · пересборка после смены настроек (налог, COGS, ФОТ) ---------- */
function refreshData(){
  CALC=computeAll();
  Object.keys(UI.rendered).forEach(k=>{if(k!=='overview')UI.rendered[k]=false;});
  const curBtn=$$('#tabs button').find(b=>b.classList.contains('on'));
  const cur=curBtn?curBtn.dataset.tab:'overview';
  const map={stats:renderStats,products:renderProducts,finance:renderFinance,account:renderAccount,method:renderMethod};
  if(cur==='overview')renderOverview();
  else{UI.rendered[cur]=true;(map[cur]||renderOverview)();}
  try{FOLD.scan();}catch(e){}
  try{warmPS();}catch(e){}/* perf v2.9: прогрев потоварной статистики после пересборки */
}
/* ---------- инициализация (v2.3: асинхронная загрузка документов из IndexedDB) ---------- */
(async function init(){
  UI.init();
  renderOverview();
  try{FOLD.scan();}catch(e){}
  try{await DOCS.migrate();}catch(e){}
  try{await DOCS.load();}catch(e){}
  try{warmPS();}catch(e){}/* perf v2.9: прогрев потоварной статистики в простое */
  /* если открыт таб с документами — перерисовать с загруженными файлами */
  const cur=$$('#tabs button').find(b=>b.classList.contains('on'));
  if(cur&&cur.dataset.tab&&cur.dataset.tab!=='overview'&&cur.dataset.tab!=='method')refreshData();
})();

</script>
